            controls.lock();
        });

        controls.addEventListener('lock', () => {
            instructions.style.display = 'none';
            document.getElementById('crosshair').style.display = 'block';
            renderer.domElement.style.pointerEvents = 'auto';
            // First entry into the world is the moment the theater starts running.
            if (!gameStarted) { gameStarted = true; startTheaterIfReady(); }
            else resumeAllMedia();   // coming back from the welcome screen
        });

        // Everything that can make noise, frozen while the welcome screen is up and restored
        // on the way back in. Only things that were actually playing get resumed, so a film
        // you had paused stays paused. The <video> elements are created detached and never
        // added to the DOM, so they have to be collected from the arrays rather than found
        // with a querySelectorAll.
        let mediaResume = [];

        function pauseAllMedia() {
            mediaResume = [];

            const videoEls = [
                ...billboards.map(b => b.video),
                ...localScreens.map(s => s.video),
            ].filter(Boolean);
            for (const v of videoEls) {
                if (!v.paused) { v.pause(); mediaResume.push(() => v.play().catch(() => {})); }
            }

            // Embedded players expose their own pause, and each SDK names it differently.
            const embed = (player, pause, play) => {
                if (!player) return;
                try { pause(player); mediaResume.push(() => { try { play(player); } catch (e) {} }); }
                catch (e) {}
            };
            for (const s of ytScreens) {
                if (s.player && s.playing && !s.paused) {
                    embed(s.player, p => p.pauseVideo(), p => p.playVideo());
                }
            }
            for (const s of vimeoScreens) {
                if (s.player && s.playing && !s.paused) {
                    embed(s.player, p => p.pause(), p => p.play());
                }
            }
            embed(youtubePlayer, p => p.pauseVideo(), p => p.playVideo());
            embed(vimeoPlayer, p => p.pause(), p => p.play());
        }

        function resumeAllMedia() {
            const queued = mediaResume;
            mediaResume = [];
            for (const fn of queued) fn();
        }

        controls.addEventListener('unlock', () => {
            document.getElementById('crosshair').style.display = 'none';
            setPrompt("");
            // Esc always comes back to the welcome screen, including mid-film, and the world
            // goes quiet behind it.
            instructions.style.display = 'flex';
            renderer.domElement.style.pointerEvents = 'auto';
            pauseAllMedia();
        });

        // { passive: false } matters: a passive listener cannot call preventDefault, and
        // without preventDefault the sideways component of a trackpad swipe still reaches
        // Chrome as a back/forward gesture even with overscroll-behavior set. Cancelling
        // every wheel event is safe here — the page is a fixed full-screen canvas with
        // `overflow: hidden`, so there is nothing that legitimately scrolls.
        document.addEventListener('wheel', (e) => {
            if (e.cancelable) e.preventDefault();

            // Gallery carousel: same feel as the shorts menu, but driven by standing in the
            // gallery rather than by looking at a hitbox — the cards float free, so there is
            // no wall to aim at.
            if ((controls.isLocked || (isMobile && mobileActive)) && galleryCards.length && playerInGallery()) {
                const now = performance.now();
                if (now - galleryWheelCooldown > 160) {
                    if (e.deltaY > 0)      galleryIndex = Math.min(galleryIndex + 1, galleryCards.length - 1);
                    else if (e.deltaY < 0) galleryIndex = Math.max(galleryIndex - 1, 0);
                    galleryWheelCooldown = now;
                }
                return;   // don't also scrub the film carousel while in here
            }
            if ((controls.isLocked || (isMobile && mobileActive)) && isHoveringMenu && menuGroup.visible) {
                const now = performance.now();
                if (now - wheelCooldown > 200) {
                    if (e.deltaY > 0) {
                        currentFilmIndex = Math.min(currentFilmIndex + 1, filmLibrary.length - 1);
                    } else if (e.deltaY < 0) {
                        currentFilmIndex = Math.max(currentFilmIndex - 1, 0);
                    }
                    wheelCooldown = now;
                }
            }
        }, { passive: false });

        document.addEventListener('mousemove', () => {
            if (controls.isLocked) resetPlayerIdle();
        });

        document.addEventListener('mousedown', () => {
            if (isMobile && mobileActive) {
                const intersects = raycaster.intersectObjects(scene.children, true);
                if (intersects.length > 0) handleAction(intersects[0]);
            } else if (controls.isLocked) {
                const intersects = raycaster.intersectObjects(scene.children, true);
                if (intersects.length > 0) handleAction(intersects[0]);
            }
        });

        // --- MOBILE SUPPORT ---
        let mobileYaw = 0;
        let mobilePitch = 0;
        let lookTouchId = null;
        let lookOriginX = 0, lookOriginY = 0;
        const lookIndicator = document.getElementById('mobile-look-indicator');
        const lookKnob = document.getElementById('mobile-look-knob');

        if (isMobile) {
            // Hide desktop HUD, show mobile controls
            document.getElementById('hud').style.display = 'none';

            // Override start button for mobile (no pointer lock)
            document.getElementById('start-button').addEventListener('touchend', (e) => {
                e.preventDefault();
                initAudio();
                mobileActive = true;
                document.getElementById('instructions').style.display = 'none';
                document.getElementById('crosshair').style.display = 'block';
                document.getElementById('mobile-controls').classList.add('active');
            }, { once: true });

            // Right-side look joystick (trackpad style)
            const lookZone = document.getElementById('mobile-look-zone');

            lookZone.addEventListener('touchstart', (e) => {
                e.preventDefault();
                for (const touch of e.changedTouches) {
                    if (lookTouchId === null) {
                        lookTouchId = touch.identifier;
                        lookOriginX = touch.clientX;
                        lookOriginY = touch.clientY;
                        // Show indicator at touch point
                        lookIndicator.style.display = 'block';
                        lookIndicator.style.left = (touch.clientX - 40) + 'px';
                        lookIndicator.style.top = (touch.clientY - 40) + 'px';
                        lookKnob.style.display = 'block';
                        lookKnob.style.left = (touch.clientX - 18) + 'px';
                        lookKnob.style.top = (touch.clientY - 18) + 'px';
                    }
                }
            }, { passive: false });

            lookZone.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (const touch of e.changedTouches) {
                    if (touch.identifier === lookTouchId) {
                        const dx = touch.clientX - lookOriginX;
                        const dy = touch.clientY - lookOriginY;

                        // Clamp knob visual to indicator radius
                        const maxR = 30;
                        const dist = Math.sqrt(dx * dx + dy * dy);
                        const clampedDx = dist > maxR ? dx * maxR / dist : dx;
                        const clampedDy = dist > maxR ? dy * maxR / dist : dy;
                        lookKnob.style.left = (lookOriginX + clampedDx - 18) + 'px';
                        lookKnob.style.top = (lookOriginY + clampedDy - 18) + 'px';

                        // Apply look — continuous drag like a trackpad
                        mobileYaw -= dx * 0.003;
                        mobilePitch += dy * 0.003;
                        mobilePitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, mobilePitch));

                        // Reset origin so drag is continuous (trackpad style)
                        lookOriginX = touch.clientX;
                        lookOriginY = touch.clientY;
                    }
                }
            }, { passive: false });

            lookZone.addEventListener('touchend', (e) => {
                for (const touch of e.changedTouches) {
                    if (touch.identifier === lookTouchId) {
                        lookTouchId = null;
                        lookIndicator.style.display = 'none';
                        lookKnob.style.display = 'none';
                    }
                }
            }, { passive: true });

            lookZone.addEventListener('touchcancel', () => {
                lookTouchId = null;
                lookIndicator.style.display = 'none';
                lookKnob.style.display = 'none';
            });

            // Mobile movement buttons
            function bindMobileBtn(id, key) {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    keyStates[key] = true;
                    el.classList.add('pressed');
                }, { passive: false });
                el.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    keyStates[key] = false;
                    el.classList.remove('pressed');
                }, { passive: false });
                el.addEventListener('touchcancel', () => {
                    keyStates[key] = false;
                    el.classList.remove('pressed');
                });
            }
            bindMobileBtn('mobile-fwd', 'KeyW');
            bindMobileBtn('mobile-back', 'KeyS');
            bindMobileBtn('mobile-left', 'KeyA');
            bindMobileBtn('mobile-right', 'KeyD');
            bindMobileBtn('mobile-jump', 'Space');

            // Mobile interact button (tap to click on whatever crosshair is pointing at)
            document.getElementById('mobile-interact').addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (mobileActive) {
                    const intersects = raycaster.intersectObjects(scene.children, true);
                    if (intersects.length > 0) handleAction(intersects[0]);
                }
            }, { passive: false });
        }

        // Update camera from touch joystick each frame
        function updateMobileCamera() {
            if (!isMobile || !mobileActive) return;
            camera.up.set(0, 1, 0);
            const euler = new THREE.Euler(mobilePitch, mobileYaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        const doors = [];
        // --- GALLERY CAROUSEL ---
        // The photos are loaded as external .webp files rather than read out of the .glb.
        // Two reasons: the exporter writes them through EXT_texture_webp and strips the
        // extension from the names, so matching them inside the model was fragile and broke
        // on re-export; and 61 embedded photos made the .glb heavy enough to stall on load.
        // As external files they stream in on demand and the model stays light.
        //
        // Only the cards you can actually see hold a texture. All 61 planes exist from the
        // start, but a texture is fetched when its card comes within LOAD_WINDOW of the
        // front — otherwise 61 full-size photos would sit in GPU memory at once for the sake
        // of the seven that are on screen.
        const GALLERY_DIR = './IMAGES/photography/WEBP/';
        const GALLERY_PHOTOS = [
            '00086452.webp', '00086436.webp', '00086604.webp',
            'ANGLE.webp', 'DSCF0161.webp', 'DSCF0906.webp', 'DSCF0923.webp',
            'DSCF0928.webp', 'DSCF1032.webp', 'DSCF1135.webp', 'DSCF1140.webp',
            'DSCF1163.webp', 'DSCF1228.webp',
            'DSCF1386.webp', 'DSCF1468.webp', 'DSCF1620.webp',
            'DSCF2098.webp', 'DSCF2157-2.webp', 'DSCF2211.webp', 'DSCF2338.webp',
            'DSCF2381.webp', 'DSCF3007.webp', 
            'DSCF4736.webp',
            'DSCF6236.webp', 'DSCF6329.webp',
            'DSCF7550.0.webp', 'DSCF7768.0.webp', 'DSCF7781.0.webp', 'DSCF8019.0.webp',
            'DSCF8147.0.webp', 'DSCF8639.0.webp', 'DSCF8814.0.webp',
            'DSCF9431-2.webp', 'GABES.webp', 'HOUSE.webp',
            'NO PARKING.webp', 'P1050232.webp',
            'P1060189.webp',
            'P1090586.webp', 'P1100630.webp', 'P1100704.webp',
            'VERTICAL00086443.webp'
        ];

        const GALLERY_BOX = new THREE.Box3(
            new THREE.Vector3(1.35, 0.00, -22.30),
            new THREE.Vector3(3.68, 2.20, -4.07));
        // Where the stack floats, and which way it faces. -PI/2 points its face at -x, back
        // toward the doorway you come in through.
        // Turned 90 degrees so the stack faces you as you come in and turn left, rather than
        // facing down the length of the room. Centred on x (2.515 is the middle of the
        // current 1.35..3.68 span) — with the cards fanning across the width, being
        // off-centre would push one side into a wall before the other.
        //
        // FOOTPRINT, at 0.65 spacing and 1.20-wide cards — how far each rank reaches from
        // the stack's centre, and the room width that clears it:
        //     front card only ....  0.60m out  ->  1.2m wide
        //     plus first neighbours 1.08m out  ->  2.2m
        //     plus second .........  1.57m out  ->  3.1m
        //     plus third ..........  2.22m out  ->  4.4m
        // Centred in the room at 2.515, NOT shifted right. Once the fan is confined to the
        // walls the centre decides how the ranks survive, and it is a narrow window: rank
        // +/-1 is 0.65 out with a 0.432 half-width, so both neighbours only clear the walls
        // while the centre sits between 2.432 and 2.598. At the old 2.85 the right-hand
        // card overhung by 0.25 and got dropped, leaving the fan falling away to the left
        // on its own.
        //
        // Rank +/-2 cannot be had at this spacing at any centre — it would need the centre
        // above 2.920 and below 2.110 at once. Two each side needs GALLERY_SPACING at 0.44
        // or less, or a wider room.
        const GALLERY_AT   = new THREE.Vector3(2.515, 0.50, -6.37);
        const GALLERY_ROTY = 0;   // faces +z; use Math.PI if it ends up facing away from you
        // Eye level here is 0.41 and the floor is at 0.03, so a picture this size cannot be
        // centred on the eye without its bottom edge going through the floor. 0.70 is the
        // compromise: about 13 degrees of look-up at normal viewing distance.
        // Scaled down 25% from 1.60 x 1.20.
        const GALLERY_MAX_W = 1.20;
        const GALLERY_MAX_H = 0.90;
        // Half the previous 1.30 step, so the fan is tighter and each card overlaps the
        // one in front. The stack spreads across the room's WIDTH, not its length — see
        // the footprint note by GALLERY_AT for what each rank needs.
        const GALLERY_SPACING = 0.65;    // sideways step between neighbours
        const GALLERY_DEPTH_STEP = 0.45; // how far each neighbour falls back
        const GALLERY_VISIBLE = 3;       // how many either side are drawn
        const GALLERY_LOAD_WINDOW = 5;   // ...and how many either side are fetched

        // The fan spreads sideways as it recedes, and past a couple of ranks the outer
        // cards were pushing through the right-hand wall into the hallway. These are the
        // room's inner faces: a card is drawn only while it fits wholly between them, so
        // the fan trims itself instead of leaking. Nothing about size, spacing or depth
        // changes — widen the room here (or shorten GALLERY_SPACING) to win ranks back.
        //
        // At the current 2.85 centre there is 0.83m to the right wall and 1.50m to the
        // left, so the right side runs out first and the fan reads lopsided by design.
        const GALLERY_WALL_MIN_X = 1.35;
        const GALLERY_WALL_MAX_X = 3.68;

        const galleryGroup = new THREE.Group();
        galleryGroup.position.copy(GALLERY_AT);
        galleryGroup.rotation.y = GALLERY_ROTY;
        scene.add(galleryGroup);

        const galleryCards = [];
        let galleryIndex = 0;
        let galleryWheelCooldown = 0;

        // Fisher-Yates. GALLERY_PHOTOS itself is left in file order — hideGlbGalleryPhotos
        // matches names against it and doesn't care how it's sorted — so only the carousel
        // gets shuffled, fresh on every load.
        function shuffledPhotos(list) {
            const out = list.slice();
            for (let i = out.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [out[i], out[j]] = [out[j], out[i]];
            }
            return out;
        }

        function createGalleryCarousel() {
            shuffledPhotos(GALLERY_PHOTOS).forEach((file) => {
                const mesh = new THREE.Mesh(
                    new THREE.PlaneGeometry(GALLERY_MAX_W, GALLERY_MAX_H),
                    new THREE.MeshBasicMaterial({
                        toneMapped: false, transparent: true, opacity: 0,
                        // Cards overlap as they recede, so they must not write depth or the
                        // nearer one punches a hole in the faded ones behind it.
                        depthWrite: false,
                    })
                );
                mesh.visible = false;
                mesh.layers.enable(PHOTO_LAYER);   // exempt from chromatic aberration
                galleryGroup.add(mesh);
                galleryCards.push({ file, mesh, requested: false });
            });
            console.info(`[gallery] ${galleryCards.length} photos ready (loaded on approach)`);
            return galleryCards.length;
        }

        function ensureGalleryTexture(card) {
            if (card.requested) return;
            card.requested = true;
            textureLoader.load(GALLERY_DIR + encodeURIComponent(card.file), (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                const img = tex.image || {};
                const aspect = (img.width && img.height) ? img.width / img.height : 1.5;
                let w = GALLERY_MAX_W, h = GALLERY_MAX_W / aspect;
                if (h > GALLERY_MAX_H) { h = GALLERY_MAX_H; w = GALLERY_MAX_H * aspect; }
                card.mesh.geometry.dispose();
                card.mesh.geometry = new THREE.PlaneGeometry(w, h);
                card.mesh.material.map = tex;
                card.mesh.material.needsUpdate = true;
                card.loaded = true;
            }, undefined, () => {
                console.warn('[gallery] failed to load', card.file);
                card.requested = false;   // let it retry if you scroll back past it
            });
        }

        // Called every frame: current card centred and full size, neighbours stepped
        // sideways, pushed back and faded, anything further out hidden entirely.
        function updateGalleryCarousel() {
            for (let i = 0; i < galleryCards.length; i++) {
                const card = galleryCards[i], mesh = card.mesh;
                const offset = i - galleryIndex;
                const dist = Math.abs(offset);

                if (dist <= GALLERY_LOAD_WINDOW) ensureGalleryTexture(card);
                if (dist > GALLERY_VISIBLE || !card.loaded) { mesh.visible = false; continue; }
                mesh.visible = true;

                const targetX = offset * GALLERY_SPACING;
                const targetZ = -dist * GALLERY_DEPTH_STEP;      // falls back in space
                const targetScale = dist === 0 ? 1 : Math.max(0.45, 1 - dist * 0.28);
                const targetOpacity = dist === 0 ? 1 : Math.max(0, 0.55 - (dist - 1) * 0.22);

                // Keep the fan inside the room. Measured on where the card is HEADING, not
                // where it currently is, so it never starts sliding through the wall and
                // then blinks out. Local x/z are turned into world x by hand because the
                // group carries the rotation and the mesh hasn't been moved yet this frame.
                const cos = Math.cos(GALLERY_ROTY), sin = Math.sin(GALLERY_ROTY);
                const worldX = GALLERY_AT.x + targetX * cos + targetZ * sin;
                const cardW = (mesh.geometry.parameters && mesh.geometry.parameters.width) || GALLERY_MAX_W;
                const halfW = cardW * targetScale / 2;
                if (worldX - halfW < GALLERY_WALL_MIN_X || worldX + halfW > GALLERY_WALL_MAX_X) {
                    mesh.visible = false;
                    continue;
                }

                mesh.position.x = THREE.MathUtils.lerp(mesh.position.x, targetX, 0.12);
                mesh.position.z = THREE.MathUtils.lerp(mesh.position.z, targetZ, 0.12);
                mesh.scale.setScalar(THREE.MathUtils.lerp(mesh.scale.x, targetScale, 0.12));
                mesh.material.opacity = THREE.MathUtils.lerp(mesh.material.opacity, targetOpacity, 0.12);
                if (mesh.material.opacity < 0.01) mesh.visible = false;
                // Nearest card draws last so it sits on top of the ones behind it.
                mesh.renderOrder = 10 + (GALLERY_VISIBLE - dist);
            }
        }

        // Best effort: if the photos are still frames inside the .glb, take them off the wall
        // so they aren't shown twice. Once they're deleted in Blender this matches nothing,
        // which is fine — it's why nothing else depends on it.
        function hideGlbGalleryPhotos(root) {
            const stems = new Set(GALLERY_PHOTOS.map(f => f.replace(/\.webp$/i, '')));
            const key = (s) => String(s || '').replace(/\.[^.]*$/, '').replace(/[^A-Za-z0-9_-]/g, '');
            let n = 0;
            root.traverse((o) => {
                if (!o.isMesh || !o.material) return;
                const mats = Array.isArray(o.material) ? o.material : [o.material];
                const hit = stems.has(key(o.name)) ||
                            mats.some(m => m && (stems.has(key(m.name)) || (m.map && stems.has(key(m.map.name)))));
                if (hit) { o.visible = false; n++; }
            });
            if (n) console.info(`[gallery] hid ${n} duplicate photo frames still in the .glb`);
            return n;
        }

        createGalleryCarousel();

        const playerInGallery = () => GALLERY_BOX.containsPoint(playerCapsule.start);

        // --- Entry gate ---------------------------------------------------------------
        // The world can't be entered until the model is in. Before this existed the welcome
        // screen was clickable from the first paint: clicking locked the pointer, hid the
        // overlay and fired startTheaterIfReady(), so you got dropped into an empty scene
        // with a short already playing and nothing to stand on — the physics loop is gated on
        // isModelLoaded, so nothing moved. It read as a freeze.
        const loadStatus = document.getElementById('load-status');
        const loadBarFill = document.getElementById('load-bar-fill');
        const startBtnEl = document.getElementById('start-button');

        function setWorldReady() {
            // The label goes away rather than repeating the call to action — that lives in
            // the welcome art. visibility rather than display so the bar doesn't jump up by
            // the height of the line at the moment it becomes clickable.
            if (loadStatus) loadStatus.style.visibility = 'hidden';
            if (loadBarFill) loadBarFill.style.width = '100%';
            if (startBtnEl) { startBtnEl.style.cursor = 'pointer'; startBtnEl.style.opacity = '1'; }
        }

        function reportLoadProgress(e) {
            if (!loadStatus || isModelLoaded) return;
            // GitHub Pages serves the .glb with a content-length, so this is a real
            // percentage there. Locally, or behind an encoding that hides the total, it
            // falls back to megabytes so it still shows movement rather than sitting still.
            if (e && e.lengthComputable && e.total) {
                const pct = Math.min(99, Math.floor((e.loaded / e.total) * 100));
                loadStatus.textContent = pct >= 99 ? 'BUILDING WORLD…' : `LOADING WORLD… ${pct}%`;
                if (loadBarFill) loadBarFill.style.width = pct + '%';
            } else if (e && e.loaded) {
                // No content-length to divide by, so there is no honest percentage. Show the
                // megabytes and leave the bar creeping towards 90 rather than inventing one.
                loadStatus.textContent = `LOADING WORLD… ${(e.loaded / 1e6).toFixed(0)}MB`;
                if (loadBarFill) {
                    const guess = Math.min(90, (e.loaded / 70e6) * 100);
                    loadBarFill.style.width = guess.toFixed(0) + '%';
                }
            }
        }

        new GLTFLoader().load('./PORTFOLIO V2.glb', (gltf) => {
            const model = gltf.scene;
            model.traverse((child) => {
                if (child.isSpotLight) {
                    child.castShadow = true;
                    child.userData.baseIntensity = child.intensity;
                    importedLights.push(child);

                    child.shadow.mapSize.width = 1024;
                    child.shadow.mapSize.height = 1024;
                    child.shadow.bias = -0.0001;
                }

                if (child.isMesh) {
                    // Only cast shadows on meshes ≥ 0.3m diagonal — skip props/decorations
                    child.geometry.computeBoundingBox();
                    const size = new THREE.Vector3();
                    child.geometry.boundingBox.getSize(size);
                    child.castShadow = size.length() >= 0.3;
                    child.receiveShadow = true;

                    // Naming conventions, checked in this order:
                    //   NOCOLLIDE in the name -> stays visible, no collision (walk/fall through)
                    //   COLLISION in the name -> hidden, still collides (invisible blocker)
                    // NOCOLLIDE is tested first because "no_collision" contains "collision"
                    // and would otherwise be hidden. Separators and Blender's .001 suffixes
                    // are ignored, so "Floor NoCollide.002" works.
                    if (isNoCollide(child.name)) {
                        child.visible = true;
                    } else if (child.name.toLowerCase().includes("collision")) {
                        child.visible = false;
                    }
                    // Sliding-door convention: the name is `door` followed by a NUMBER,
                    // with any separators between — so `door 1`, `door_2`, `Door.3`,
                    // `door10` all qualify. `doorway` does not: after `door` comes a
                    // letter, never a digit. Add a numbered door in Blender and it picks
                    // up the mechanic with no code change.
                    if (isSlidingDoor(child.name)) {
                        if (child.material) child.material.side = THREE.DoubleSide;
                        doors.push({ mesh: child, progress: 0 });
                    }
                }
            });
            scene.add(model);
            hideGlbGalleryPhotos(model);
            // The Slavic TV lives in the model, so this can only run once the model is here.
            // loop false — plays through once, then a click starts it again.
            attachGlbScreenVideo(model, 'tv_screen', './VIDS/MPCC/how-to-make-content.mp4',
                                 { flipY: false }, false);
            // The reaction film plays on the classic laptop in the SAMSUNG room.
            attachGlbYouTubeScreen(model, 'classic_laptop_screen', 'gk9VACPUg6g');
            model.updateMatrixWorld(true);

            // --- SLIDING DOOR SETUP ---
            // Each door slides horizontally, in its own plane, by a hair over its own width,
            // so the panel fully clears its opening and runs along the wall face.
            //
            // AXIS is derived per door, not hardcoded: a door panel is thin through the wall
            // and wide along it, so whichever of world X / Z the bounding box is WIDER in is
            // the direction it must travel. Sliding along the thin axis would drive the panel
            // through its own wall.
            //
            //   door_1, door_2  in the end wall  ->  0.42 x 0.05 (X x Z)  ->  slides along X
            //   door_3          in the vault side ->  0.05 x 0.42          ->  slides along Z
            //
            // DIRECTION is inward, toward the world centre line on that axis. For the end-wall
            // pair that's what the geometry demands: the panels are 0.42 wide with outer edges
            // at x = ∓0.942 while the wall only reaches ±1.30, so sliding outward leaves 0.358
            // of room and the door would overhang into the vault. There's 1.06 of solid wall
            // between them, which is ample. Flip DOOR_SLIDE_INWARD to reverse every door.
            //
            // The offset is computed in WORLD space and converted into the door's parent space
            // via the inverse parent matrix. That matters because these nodes carry Blender's
            // Z-up conversion, so their local axes don't line up with world X/Z — nudging a
            // local component would send them sideways-and-through the floor. Going via the
            // matrix also survives any parent rotation or scale.
            const DOOR_SLIDE_INWARD = true;
            {
                const _size = new THREE.Vector3();
                const _centre = new THREE.Vector3();
                const _bbox = new THREE.Box3();
                for (const door of doors) {
                    _bbox.setFromObject(door.mesh);
                    _bbox.getSize(_size);
                    _bbox.getCenter(_centre);

                    const axis = _size.x >= _size.z ? 'x' : 'z';
                    const travel = _size[axis] * 1.02;
                    const outward = _centre[axis] >= 0 ? 1 : -1;
                    const dir = DOOR_SLIDE_INWARD ? -outward : outward;

                    const parentInv = new THREE.Matrix4().copy(door.mesh.parent.matrixWorld).invert();
                    const worldClosed = door.mesh.getWorldPosition(new THREE.Vector3());
                    const worldOpen = worldClosed.clone();
                    worldOpen[axis] += dir * travel;

                    door.axis = axis;                       // exposed for the ?debug=1 handle
                    door.travel = dir * travel;
                    door.closedPos = worldClosed.clone().applyMatrix4(parentInv);
                    door.openPos = worldOpen.applyMatrix4(parentInv);

                    // Fixed anchor for the proximity test, taken from the door's world
                    // BOUNDING-BOX CENTRE — not its object origin.
                    //
                    // These meshes have their origin at (0,0,0) with the offset baked into
                    // the vertices, so getWorldPosition() returns the world origin, ~1.83
                    // away from the actual door. Anchoring there meant the doors fired when
                    // you walked past the middle of the corridor and never when you stood
                    // in front of them. The bbox centre is correct regardless of where
                    // Blender left the origin.
                    //
                    // Distance is unsigned, so this recognises the player from either side
                    // — corridor or apron — with no front/back special-casing.
                    //
                    // It's also a fixed point rather than the live position: using the
                    // door's current position would drag the trigger along as it slides,
                    // making it oscillate on the threshold.
                    door.triggerPos = _centre.clone();
                }
            }

            // Build the collision octree from architecture only.
            //
            // The octree stores every triangle handed to it, duplicated across the cells it
            // spans, so its cost scales with the model's full triangle count — and the model
            // is ~212k triangles, about 70% of which is foliage, signage and the underground
            // well shaft. Feeding it everything cost ~860MB of JS heap (900MB total vs 38MB
            // without it), which is enough to OOM the tab on a machine that's also running
            // Blender. None of that geometry needs collision: you're meant to walk through
            // grass, and the text and light-bulb spheres are decoration.
            //
            // Detach the excluded meshes (and the doors, which animate) just long enough to
            // build the octree, then put them back on their original parents. add() rather
            // than attach() so local transforms are left untouched.
            // Two ways a mesh is left out of the octree: it matches the decorative-category
            // list below, or it is explicitly tagged NOCOLLIDE in Blender.
            //
            // WORLD CONFIG — this list is mesh-name specific, so it must be re-checked
            // against every new export.
            //
            // The old world's list was
            //   /^(grass|log_|stone|flower|small ?tree|big ?tree|sphere|circle|text|cylinder)/i
            // and reusing it here would be a silent disaster: in this model `Circle` is the
            // VAULT — the curved wall-and-ceiling shell that provides all the side
            // containment. Excluding it would let you walk straight out through the walls.
            //
            // Current model's meshes: Plane (floor), Plane.001 (end wall), Plane.002
            // (divider), Circle (vault) — all structural. Sphere/Sphere.001 are door
            // handles and Text/Text.001 are the door labels — those are the only genuinely
            // decorative ones, and they're tiny.
            //
            // At 7.8k triangles this model has no octree cost worth optimising, so the list
            // is deliberately minimal. Prefer tagging meshes NOCOLLIDE in Blender over
            // growing this regex — explicit beats pattern-matching that can catch the wrong
            // thing, which is exactly the trap `circle` was.
            const DECORATIVE = /^(sphere|text)/i;
            const skipped = [];
            model.traverse((child) => {
                if (child.isMesh && (DECORATIVE.test(child.name) || isNoCollide(child.name))) skipped.push(child);
            });

            const doorParents = doors.map(d => d.mesh.parent);
            const skipParents = skipped.map(m => m.parent);
            doors.forEach(d => d.mesh.removeFromParent());
            skipped.forEach(m => m.removeFromParent());
            worldOctree.fromGraphNode(model);

            skipped.forEach((m, i) => skipParents[i].add(m));
            doors.forEach((d, i) => doorParents[i].add(d.mesh));

            // --- SCREENS PLACED FROM GLB MARKERS ---
            // Read a marker's world transform, then hide it. Hiding costs it no collision:
            // Octree.fromGraphNode walks with traverse(), not traverseVisible(), so
            // visibility is irrelevant to it — meshes leave the octree only by being
            // detached from the graph, which is what the DECORATIVE/door handling above
            // does. So the slab still blocks you; it just stops drawing.
            // `facesToward` is a world point the screen should turn to face — normally the
            // centre of the room it hangs in. Pass null to fall back to facing the world
            // origin.
            function readMarker(name, facesToward) {
                const marker = model.getObjectByName(name);
                if (!marker) {
                    console.warn(`[theater] marker "${name}" not found in the GLB`);
                    return null;
                }
                marker.updateWorldMatrix(true, true);
                const box = new THREE.Box3().setFromObject(marker);
                const size = box.getSize(new THREE.Vector3());
                const centre = box.getCenter(new THREE.Vector3());

                // A screen slab is thin through its wall and wide across it, so the THINNER
                // of the two horizontal axes is the one it faces along. Measuring the box is
                // reliable in a way that sampling one vertex normal is not — a marker that
                // exports as several primitives can hand back an edge's normal, which both
                // flips the facing and makes the code read the slab's thickness as its
                // width.
                const facesX = size.x <= size.z;
                // Which way along that axis: toward the room.
                let dir = facesToward
                    ? Math.sign((facesX ? facesToward.x - centre.x : facesToward.z - centre.z))
                    : -Math.sign(facesX ? centre.x : centre.z);
                if (dir === 0) dir = 1;
                const normal = facesX
                    ? new THREE.Vector3(dir, 0, 0)
                    : new THREE.Vector3(0, 0, dir);
                // A plane's default normal is +Z, so rotY is the angle turning +Z onto it.
                const rotY = Math.atan2(normal.x, normal.z);
                const pad = 0.035;   // inset slightly so the modelled surround still reads

                marker.traverse(o => { if (o.isMesh) o.visible = false; });
                marker.visible = false;

                return {
                    position: centre, rotY,
                    width: Math.max(0.1, (facesX ? size.z : size.x) - pad * 2),
                    height: Math.max(0.1, size.y - pad * 2),
                };
            }

            // World-space centre of a named object, or null. Used to aim screens.
            function centreOf(name) {
                const o = model.getObjectByName(name);
                if (!o) return null;
                o.updateWorldMatrix(true, true);
                return new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());
            }

            // The main theater — carousel, poster wall, player UI, every short.
            theaterPlacement = readMarker(MAIN_THEATER_MARKER, centreOf(MAIN_THEATER_ROOM));
            applyTheaterPlacement();

            // --- THEATER ZONES: autoplay trigger, audio ramp, and control reach ---
            // All measured from the model, so rebuilding the theater at a different size
            // re-derives them rather than needing numbers updated here.
            {
                const tunnelObj = model.getObjectByName(THEATER_TUNNEL_MESH);
                const roomObj = model.getObjectByName(MAIN_THEATER_ROOM);

                if (tunnelObj && roomObj) {
                    const tunnel = new THREE.Box3().setFromObject(tunnelObj)
                        .expandByScalar(THEATER_TRIGGER_PAD);
                    const room = new THREE.Box3().setFromObject(roomObj);

                    // Ramp length = the furthest a tunnel corner sits from the room, so the
                    // fade spans the whole tunnel however it is oriented.
                    let rampLength = 0.001;
                    for (const x of [tunnel.min.x, tunnel.max.x])
                        for (const y of [tunnel.min.y, tunnel.max.y])
                            for (const z of [tunnel.min.z, tunnel.max.z])
                                rampLength = Math.max(rampLength,
                                    room.distanceToPoint(new THREE.Vector3(x, y, z)));

                    theaterZones = { tunnel, room, rampLength };
                    console.info(`[theater] audio ramps over ${rampLength.toFixed(2)}m of tunnel`);
                }

                // Control reach: the UI has to stay clickable from the far corner of the
                // room. The default 4-8m was fine for a 3.6m screen in a small room; this
                // room is 38m deep, so the reach is derived from the geometry instead.
                if (theaterPlacement) {
                    let reach, how;
                    if (THEATER_CONTROL_REACH !== null) {
                        reach = THEATER_CONTROL_REACH;
                        how = 'THEATER_CONTROL_REACH';
                    } else if (roomObj) {
                        const room = new THREE.Box3().setFromObject(roomObj);
                        reach = 0;
                        for (const x of [room.min.x, room.max.x])
                            for (const y of [room.min.y, room.max.y])
                                for (const z of [room.min.z, room.max.z])
                                    reach = Math.max(reach,
                                        theaterPlacement.position.distanceTo(new THREE.Vector3(x, y, z)));
                        reach = Math.ceil(reach + THEATER_REACH_MARGIN);
                        how = 'far room corner to screen';
                    }
                    if (reach !== undefined) {
                        for (const k of ['video_surface', 'menu_hitbox', 'select_film', 'back_menu']) {
                            INTERACT_RANGE[k] = reach;
                        }
                        // raycaster.far caps every range, so it has to clear the largest.
                        raycaster.far = Math.max(raycaster.far, reach);
                        console.info(`[theater] controls reach ${reach}m (${how})`);
                    }
                }
            }

            // Single-film screens, if any are configured.
            for (const spec of THEATER_SCREENS) {
                const m = readMarker(spec.marker, spec.room ? centreOf(spec.room) : null);
                if (!m) continue;
                setupVimeoScreen(spec.videoId, m.position.x, m.position.y, m.position.z,
                                 m.rotY, m.width, m.height, spec.title);
            }

            isModelLoaded = true;
            setWorldReady();
        }, reportLoadProgress, (error) => {
            console.error(error);
            if (loadStatus) loadStatus.textContent = 'COULD NOT LOAD THE WORLD — TRY RELOADING';
            setPrompt('ERROR LOADING MODEL: ' + error.message);
        });

        // --- Fetch from both APIs then setup theater ---
        Promise.all([
            fetchVimeoVideos().catch(err => { console.error('Vimeo fetch failed:', err); return []; }),
            fetchYouTubeVideos().catch(err => { console.error('YouTube fetch failed:', err); return []; })
        ]).then(([vimeoVideos, youtubeVideos]) => {
            filmLibrary = [...vimeoVideos, ...youtubeVideos];
            // Ordered by ID, not title — see FILM_ORDER. Unlisted films keep their fetch
            // order and land after everything listed.
            filmLibrary.sort((a, b) => {
                const ai = FILM_ORDER.indexOf(String(a.id));
                const bi = FILM_ORDER.indexOf(String(b.id));
                return (ai === -1 ? 9999 : ai) - (bi === -1 ? 9999 : bi);
            });
            // Anything fetched but not placed in FILM_ORDER is worth knowing about, since
            // it will silently sit at the end of the carousel.
            const unordered = filmLibrary.filter(f => FILM_ORDER.indexOf(String(f.id)) === -1);
            if (unordered.length) {
                console.info('[films] not in FILM_ORDER, appended at the end:',
                    unordered.map(f => `${f.title} [${f.source} ${f.id}]`));
            }
            filmLibrary.unshift({
                source: 'instruction',
                title: 'Scroll for options',
                thumb: './ui/scroll for options.png',
                embedUrl: '',
                width: 16,
                height: 9
            });
            setupTheater();
            // The library may finish after the player has already entered the world, in
            // which case this is the call that actually starts the film.
            startTheaterIfReady();
        });

        // --- 8. ANIMATION LOOP ---
        function isPlayerActive() { return controls.isLocked || (isMobile && mobileActive); }

        // Is anything actually playing right now? Drives the house-lights dim and the dust
        // fade. Paused counts as not playing, so pausing brings the room back up.
        function filmIsPlaying() {
            if (playbackGroup && playbackGroup.visible && !isVideoPaused) return true;   // main theater
            if (vimeoScreens.some(s => s.playing && !s.paused)) return true;
            if (ytScreens.some(s => s.playing && !s.paused)) return true;
            if (localScreens.some(s => s.playing)) return true;
            return false;
        }

        // --- One embed on screen at a time -------------------------------------------
        //
        // The work screens were going black, and it turned out the theater's iframe was
        // painting over them. Both embeds live in the same CSS3D layer, and that layer has
        // no depth buffer — the browser sorts those elements against each other by their
        // transformed polygons. The theater's panel is about 25m wide against a work
        // screen's 0.87m, so the sort picks the theater, and the work screen's hole ends up
        // showing the theater's element instead of its own. Black, because the part of the
        // theater panel covering that hole is nowhere near its video.
        //
        // That is why it only bit from one side: the theater sits at x +24, off to your
        // RIGHT as you face a work-room wall, so the two only overlap once you are to the
        // LEFT of a screen looking back across it. Confirmed by hiding the theater's embed
        // at the moment of failure — the work screen came straight back.
        //
        // Size is not the problem and no threshold would have caught it: the reported
        // failure measured 846x1117, a size you pass through at ordinary viewing distance.
        //
        // The theater keeps PLAYING while suppressed. Only `visible` is touched, which sets
        // display:none, and browsers don't treat that as a reason to stop playback —
        // measured at 4.0s of progress over 4s hidden. So the film is still where it should
        // be when you walk back in, and the zone volume ramp stays in step with it.
        // The theater embed is suppressed only while you are actually STANDING AT a playing
        // work screen — an absolute range, not a comparison against the theater's distance.
        //
        // Two earlier versions of this were wrong, both in ways worth remembering:
        //
        //   Gating on "any work screen is playing" suppressed the theater for the rest of
        //   the session, because a work screen stays `playing` until something explicitly
        //   stops it and walking away doesn't. You arrived to a film you could hear but not
        //   see.
        //
        //   Gating on "whichever is nearer" moved the problem rather than fixing it: with a
        //   screen playing back in SEES CANDY, the crossover where it becomes nearer than
        //   the theater falls at about x 8, so the theater screen blanked as you walked away
        //   from it down the approach — visible at x 7.9, gone a step further back.
        //
        // A fixed radius has neither failure. It only fires where the overlap actually
        // happens: the work rooms run x -1.29 to -7.53, so 6m covers standing anywhere in
        // one with its screen running, while leaving the theater visible from right across
        // the space. The bug this all exists for showed up at 0.3-0.6m, well inside it.
        const WORK_EMBED_NEAR = 6.0;

        const _eeA = new THREE.Vector3();

        function updateEmbedExclusivity() {
            if (!cssObject) return;

            let atWorkScreen = false;
            for (const s of [...ytScreens, ...vimeoScreens]) {
                if (!s.playing || !s.mesh) continue;
                if (s.mesh.getWorldPosition(_eeA).distanceTo(camera.position) < WORK_EMBED_NEAR) {
                    atWorkScreen = true;
                    break;
                }
            }

            const wanted = !!(playbackGroup && playbackGroup.visible) && !atWorkScreen;
            if (cssObject.visible !== wanted) cssObject.visible = wanted;
        }

        function animate() {
            // Update mobile gyro camera before physics
            if (isMobile && mobileActive) updateMobileCamera();

            const delta = clock.getDelta();
            const pDelta = Math.min(0.05, delta) / 5;

            for (let i = 0; i < 5; i++) {
                if (isPlayerActive() && isModelLoaded) {
                    const speed = (keyStates['ShiftLeft'] ? 8.0 : 5.0);
                    camera.getWorldDirection(playerDirection);
                    playerDirection.y = 0; playerDirection.normalize();

                    const side = new THREE.Vector3().crossVectors(camera.up, playerDirection).normalize();

                    const forward = playerDirection.clone();
                    const right = side.clone().negate();

                    const isMovingKeys = keyStates['KeyW'] || keyStates['KeyS'] || keyStates['KeyA'] || keyStates['KeyD'] || keyStates['ArrowUp'] || keyStates['ArrowDown'] || keyStates['ArrowLeft'] || keyStates['ArrowRight'];

                    if (isMovingKeys) {
                        if (keyStates['KeyW'] || keyStates['ArrowUp']) playerVelocity.add(forward.clone().multiplyScalar(pDelta * speed));
                        if (keyStates['KeyS'] || keyStates['ArrowDown']) playerVelocity.add(forward.clone().multiplyScalar(-pDelta * speed));
                        if (keyStates['KeyA'] || keyStates['ArrowLeft']) playerVelocity.add(right.clone().multiplyScalar(-pDelta * speed));
                        if (keyStates['KeyD'] || keyStates['ArrowRight']) playerVelocity.add(right.clone().multiplyScalar(pDelta * speed));
                    }

                    if (playerOnGround && keyStates['Space'] && !spaceHandled) {
                        if (keyStates['ShiftLeft'] || keyStates['ShiftRight']) {
                            playerVelocity.y = (superJumpCount % 3 === 2) ? 200.0 : 12.0;
                            playSuperJumpSound();
                        } else {
                            playerVelocity.y = 2.0;
                        }
                        spaceHandled = true;
                    }
                    if (!keyStates['Space']) spaceHandled = false;

                    // Walking gait — sine wave lifts capsule, ground is the floor
                    const isMoving = keyStates['KeyW'] || keyStates['KeyS'] || keyStates['KeyA'] || keyStates['KeyD'] || keyStates['ArrowUp'] || keyStates['ArrowDown'] || keyStates['ArrowLeft'] || keyStates['ArrowRight'];
                    if (playerOnGround && isMoving) {
                        headBobTime += pDelta * 20;                    // tweak: cycle speed (higher = faster steps)
                        const lift = Math.max(0, Math.sin(headBobTime)) * 1.0;  // tweak: lift strength
                        playerVelocity.y = Math.max(playerVelocity.y, lift);
                    }

                    playerVelocity.y -= 12.0 * pDelta;
                    playerVelocity.addScaledVector(playerVelocity, Math.exp(-4 * pDelta) - 1);

                    const wasOnGround = playerOnGround;
                    playerCapsule.translate(playerVelocity.clone().multiplyScalar(pDelta));
                    const result = worldOctree.capsuleIntersect(playerCapsule);
                    playerOnGround = false;

                    if (result) {
                        const isGround = result.normal.y > 0.7;
                        playerOnGround = isGround;
                        if (isGround) groundNormal.copy(result.normal);
                        playerCapsule.translate(result.normal.clone().multiplyScalar(result.depth));

                        // Step-up: if collision is not clean ground and we were grounded
                        if (!isGround && wasOnGround) {
                            // 0.5 was inherited from the old world, where it was most of a
                            // body height. In a 0.60-clearance tunnel it lifts the capsule
                            // straight into the ceiling, and the resulting push-out is what
                            // fired the player sideways out of `theater 1 tunnel`.
                            // 0.20 is ~40% of the 0.50 capsule — still a generous stair rise.
                            const STEP = 0.20;
                            // Save position after pushback
                            const preStepStart = playerCapsule.start.clone();
                            const preStepEnd = playerCapsule.end.clone();

                            // Lift capsule up
                            playerCapsule.translate(new THREE.Vector3(0, STEP, 0));
                            const stepCheck = worldOctree.capsuleIntersect(playerCapsule);
                            if (stepCheck && stepCheck.depth > 0.02) {
                                // Still jammed once lifted — there's no headroom to step
                                // into, so this is a wall or a low ceiling, not a ledge.
                                // Abort rather than resolving it: resolving a penetration
                                // this deep shoves the capsule a long way sideways and
                                // teleports the player. Bailing leaves them standing against
                                // the obstruction, which is what should happen.
                                playerCapsule.start.copy(preStepStart);
                                playerCapsule.end.copy(preStepEnd);
                            } else {
                                if (stepCheck) {
                                    playerCapsule.translate(stepCheck.normal.clone().multiplyScalar(stepCheck.depth));
                                }
                                // Settle back down
                                playerCapsule.translate(new THREE.Vector3(0, -STEP, 0));
                                const groundCheck = worldOctree.capsuleIntersect(playerCapsule);
                                if (groundCheck && groundCheck.normal.y > 0.5) {
                                    // Stepped up successfully
                                    playerCapsule.translate(groundCheck.normal.clone().multiplyScalar(groundCheck.depth));
                                    playerOnGround = true;
                                    groundNormal.copy(groundCheck.normal);
                                    playerVelocity.y = 0;
                                } else {
                                    // Step failed, revert
                                    playerCapsule.start.copy(preStepStart);
                                    playerCapsule.end.copy(preStepEnd);
                                }
                            }
                        }
                    }
                    // Lock horizontal position when idle on ground
                    if (!isMovingKeys && playerOnGround && !keyStates['Space']) {
                        playerCapsule.start.x = idlePos.x;
                        playerCapsule.start.z = idlePos.z;
                        playerCapsule.end.x = idlePos.x;
                        playerCapsule.end.z = idlePos.z;
                        playerVelocity.x = 0;
                        playerVelocity.z = 0;
                    } else {
                        idlePos.set(playerCapsule.start.x, playerCapsule.start.y, playerCapsule.start.z);
                    }

                    camera.position.copy(playerCapsule.end);
                }
            }

            if (!playerOnGround) headBobTime = 0;

            // Door open-on-contact
            if (isModelLoaded && doors.length) {
                // Radius around each door's centre that opens it, from any direction.
                // The two doors are 1.48 apart, so anything under ~0.74 keeps them fully
                // independent; above that they start opening as a pair.
                const TRIGGER_DIST = .6;
                const OPEN_SPEED = 3.0;
                for (const door of doors) {
                    const dist = playerCapsule.start.distanceTo(door.triggerPos);
                    const target = dist < TRIGGER_DIST ? 1 : 0;

                    // Fire on the EDGE, not on `target`, or it would retrigger every frame
                    // you stand in the trigger radius. `wasOpening` latches until you leave,
                    // so backing off and walking in again plays it once more, which is what
                    // you want — but loitering in the doorway doesn't machine-gun it.
                    if (target === 1 && !door.wasOpening) playDoorSound(door);
                    door.wasOpening = target === 1;

                    door.progress += (target - door.progress) * Math.min(1, delta * OPEN_SPEED);
                    door.mesh.position.lerpVectors(door.closedPos, door.openPos, door.progress);
                }
            }

            // Theater: start the film on entering the tunnel, and ride the audio up as the
            // player closes on the room. Runs whether or not the pointer is locked so the
            // volume is already correct the moment control resumes.
            if (isModelLoaded) updateTheaterProximity();
            updateEmbedExclusivity();
            updatePromptFade();

            if (isPlayerActive()) {
                raycaster.setFromCamera(centerPoint, camera);
                const intersects = raycaster.intersectObjects(scene.children, true);

                let isHoveringPlayerUI = false;
                isHoveringMenu = false;

                let prompt = "";
                if (intersects.length > 0) {
                    const target = intersects[0].object;
                    const type = target.userData.type;
                    const dist = intersects[0].distance;
                    const maxDist = interactRange(type);

                    if (dist > maxDist) {
                        prompt = "";
                    } else if (type === 'back_menu') {
                        isHoveringPlayerUI = true;
                        prompt = target.userData.label || "";
                    } else if (type === 'video_surface') {
                        prompt = isVideoPaused ? "CLICK TO PLAY" : "CLICK TO PAUSE";
                    } else if (type === 'yt_screen') {
                        const scr = ytScreens.find(s => s.videoId === target.userData.videoId);
                        if (scr && scr.playing && !scr.paused) prompt = "CLICK TO PAUSE";
                        else if (scr && scr.paused) prompt = "CLICK TO RESUME";
                        else prompt = "CLICK TO PLAY";
                    } else if (type === 'local_screen') {
                        // Matched on the mesh — two screens can share a videoSrc.
                        const scr = localScreens.find(s => s.mesh === target)
                                 || localScreens.find(s => s.videoSrc === target.userData.videoSrc);
                        prompt = (scr && scr.playing) ? "CLICK TO PAUSE" : "CLICK TO PLAY";
                    } else if (type === 'vimeo_screen') {
                        const scr = vimeoScreens.find(s => s.videoId === target.userData.videoId);
                        const label = scr && scr.title ? `: ${scr.title}` : '';
                        if (scr && scr.playing && !scr.paused) prompt = "CLICK TO PAUSE";
                        else if (scr && scr.paused) prompt = "CLICK TO RESUME";
                        else prompt = `CLICK TO PLAY${label}`;
                    } else if (type === 'menu_hitbox' || type === 'select_film') {
                        isHoveringMenu = true;
                        prompt = "SCROLL UP AND DOWN TO NAVIGATE\nCLICK TO WATCH";
                    }
                }

                // Nothing under the crosshair: the gallery still has something to say, since
                // the carousel gives no other clue that it scrolls. Only when there is no
                // other prompt, so looking at something never gets overridden.
                if (!prompt && playerInGallery()) {
                    prompt = "SCROLL UP AND DOWN TO FLIP THROUGH";
                }
                setPrompt(prompt);

                const shouldShowUI = playbackGroup.visible && isVideoPaused;
                const targetAlpha = shouldShowUI ? 1.0 : 0.0;
                if (backBtn) {
                    if (shouldShowUI) { backBtn.layers.enable(2); }
                    else { backBtn.layers.disable(2); }
                }
                playbackGroup.children.forEach(mesh => {
                    if (mesh.material) {
                        if (mesh.material.uniforms && mesh.material.uniforms.opacity) {
                            mesh.material.uniforms.opacity.value = THREE.MathUtils.lerp(mesh.material.uniforms.opacity.value, targetAlpha, 0.1);
                            mesh.material.uniforms.hueShift.value = (performance.now() * 0.0001) % 1.0;
                        } else {
                            mesh.material.opacity = THREE.MathUtils.lerp(mesh.material.opacity, targetAlpha, 0.1);
                        }
                    }
                });
            }

            updateGalleryCarousel();

            // Carousel animation
            if (menuGroup && menuGroup.visible) {
                menuThumbnails.forEach((thumb, i) => {
                    const offset = i - currentFilmIndex;

                    const screenRatio = currentScreenWidth / 16;
                    const dynamicSpacing = Math.min(4.8, currentScreenWidth * 0.28);

                    const targetX = offset * dynamicSpacing;
                    const targetZ = 0.2 - (Math.abs(offset) * 0.05);

                    const sideScale = Math.min(0.6, screenRatio * 0.6);
                    const targetScale = offset === 0 ? 1 : sideScale;

                    let targetOpacity = offset === 0 ? 1 : Math.max(0, 0.4 - (Math.abs(offset) - 1) * 0.4);

                    thumb.position.x = THREE.MathUtils.lerp(thumb.position.x, targetX, 0.1);
                    thumb.position.z = THREE.MathUtils.lerp(thumb.position.z, targetZ, 0.1);
                    thumb.scale.setScalar(THREE.MathUtils.lerp(thumb.scale.x, targetScale, 0.1));

                    if (thumb.material) {
                        thumb.material.opacity = THREE.MathUtils.lerp(thumb.material.opacity, targetOpacity, 0.1);

                        const currentThumbHalfWidth = 3.75 * thumb.scale.x;
                        const isOutsideBounds = Math.abs(thumb.position.x) + currentThumbHalfWidth > (currentScreenWidth / 2) + 0.1;
                        thumb.visible = !isOutsideBounds && thumb.material.opacity > 0.01;
                    }
                });
            }


            // House lights: derived from whether anything is actually playing, so every
            // screen type dims the room without having to remember to do it itself, and
            // stopping one screen while another is still running doesn't bring them up.
            dimMultiplier = filmIsPlaying() ? DIM_WHEN_PLAYING : 1.0;

            // Smooth lighting transitions
            scene.environmentIntensity = THREE.MathUtils.lerp(scene.environmentIntensity !== undefined ? scene.environmentIntensity : targetHdrIntensity, targetHdrIntensity * dimMultiplier, 0.05);
            if (skyboxMat) {
                const curr = skyboxMat.userData.currentIntensity;
                const next = THREE.MathUtils.lerp(curr, targetHdrIntensity * dimMultiplier, 0.05);
                skyboxMat.color.setScalar(next);
                skyboxMat.userData.currentIntensity = next;
            }

            ambientLight.intensity = THREE.MathUtils.lerp(ambientLight.intensity, targetRoomLightIntensity * 0.4 * dimMultiplier, 0.05);
            hemiLight.intensity = THREE.MathUtils.lerp(hemiLight.intensity, targetRoomLightIntensity * 0.6 * dimMultiplier, 0.05);

            activePointLights.forEach(light => {
                light.intensity = THREE.MathUtils.lerp(light.intensity, targetPointLightIntensity * dimMultiplier, 0.05);
            });

            importedLights.forEach(light => {
                if (light.userData.baseIntensity !== undefined) {
                    light.intensity = THREE.MathUtils.lerp(light.intensity, light.userData.baseIntensity * dimMultiplier, 0.05);
                }
            });

            // Billboard videos — yaw to face the camera, play and fade by distance.
            for (const bb of billboards) {
                if (bb.done) continue;   // playOnce clip that has already run; stays off
                // Yaw only. Copying the camera's full rotation would tip the plane as you
                // look up or down (and you're looking straight down while falling); rotating
                // about Y alone keeps it standing upright and just turns to face you.
                // Wall-mounted panels are `fixed` and keep the rotation they were given.
                const toCam = camera.position.clone().sub(bb.mesh.position);
                if (!bb.fixed) bb.mesh.rotation.set(0, Math.atan2(toCam.x, toCam.z), 0);

                const dist = toCam.length();
                // A wall panel only counts as near when you're on its face side. Distance
                // alone measures straight through the wall it's mounted on — the welcome
                // panel sits 2.29m from spawn, so without this it starts the moment you
                // load, audible from behind a wall you can't see it through.
                let inFront = true;
                if (bb.fixed) {
                    const normal = new THREE.Vector3(0, 0, 1).applyQuaternion(bb.mesh.quaternion);
                    inFront = normal.dot(toCam) > 0;
                }
                // startWithin, not playWithin: the two are the same for every clip that
                // doesn't set it, but where they differ the clip starts (and stops) on the
                // wider range and only the VOLUME follows playWithin below. Using playWithin
                // here would start a clip at 30m and stop it again at 10m.
                // Falls back to playWithin if startWithin is absent. Belt and braces: when
                // this test first moved off playWithin, the wall videos had no startWithin
                // on their record, `dist <= undefined` was false, and the welcome panel
                // silently stopped playing at all. Anything billboard-shaped should work
                // here whether or not it carries the newer field.
                const range = bb.startWithin != null ? bb.startWithin : bb.playWithin;
                // startBox is a per-axis test, so the trigger volume is a cube rather than a
                // sphere — every one of x, y and z has to be inside it. Uses the same toCam
                // vector, just component-wise instead of its length.
                const near = inFront && (bb.startBox != null
                    ? (Math.abs(toCam.x) <= bb.startBox &&
                       Math.abs(toCam.y) <= bb.startBox &&
                       Math.abs(toCam.z) <= bb.startBox)
                    : dist <= range);   // <= so it fires exactly at the mark
                if (near && !bb.playing) playBillboard(bb);
                else if (!near && bb.playing) {
                    bb.video.pause(); bb.playing = false; bb.video.volume = 0;
                    if (bb.hideWhenIdle) bb.mesh.visible = false;
                }

                // Full volume inside fullVolumeAt, silent by playWithin, linear between.
                // Setting fullVolumeAt >= playWithin turns the fade off entirely: the clip
                // is simply at full volume the moment it triggers.
                if (bb.playing) {
                    if (bb.fullVolumeAt >= bb.playWithin) {
                        bb.video.volume = 1;
                    } else {
                        const span = bb.playWithin - bb.fullVolumeAt;
                        bb.video.volume = THREE.MathUtils.clamp((bb.playWithin - dist) / span, 0, 1);
                    }
                }
            }

            // Dust particles — faded right out while a film plays, on the same 0.05 lerp as
            // the lights so the room and the dust settle together. Once effectively
            // invisible the system is switched off, which also skips the 2000-particle
            // position update below.
            if (particleSystem) {
                const dustTarget = dimMultiplier < 1.0 ? 0 : DUST_OPACITY;
                particleSystem.material.opacity = THREE.MathUtils.lerp(
                    particleSystem.material.opacity, dustTarget, 0.05);
                particleSystem.visible = particleSystem.material.opacity > 0.004;
            }

            if (particleSystem && particleSystem.visible) {
                const pos = particleSystem.geometry.attributes.position.array;
                const vel = particleSystem.userData.velocities;
                for (let i = 0; i < vel.length; i++) {
                    pos[i * 3] += vel[i].x * delta;
                    pos[i * 3 + 1] += vel[i].y * delta;
                    pos[i * 3 + 2] += vel[i].z * delta;

                    if (pos[i * 3 + 1] < 0) {
                        pos[i * 3 + 1] = 10;
                        pos[i * 3] = (Math.random() - 0.5) * 30;
                        pos[i * 3 + 2] = (Math.random() - 0.5) * 30;
                    }
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
            }

            // Mask first: it feeds the aberration pass, so it has to be current for
            // this frame's camera or the exempt region lags a frame behind.
            renderPhotoMask();
            // Update to Post-Processing Composer Render
            composer.render();
            cssRenderer.render(scene, camera);

            requestAnimationFrame(animate);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            cssRenderer.setSize(window.innerWidth, window.innerHeight);
            // Update Composer on resize
            composer.setSize(window.innerWidth, window.innerHeight);
            maskTarget.setSize(Math.max(1, window.innerWidth >> 1),
                               Math.max(1, window.innerHeight >> 1));
        });

        // Dev helper — visit with ?debug=1 to inspect/position content from the console.
        // __world.tp(x, z) teleports the player; __world.look(x, y, z) aims the camera.
        if (new URLSearchParams(location.search).has('debug')) {
            window.__world = {
                THREE, scene, camera, renderer, playerCapsule, controls, ytScreens, localScreens, worldOctree, doors,
                billboards,
                composer, rgbShiftPass, maskTarget, renderPhotoMask,
                galleryCards, galleryGroup, playerInGallery,
                get galleryIndex() { return galleryIndex; },
                setGalleryIndex(i) { galleryIndex = i; },
                vimeoScreens, toggleVimeoScreen, stopVimeoScreen, filmIsPlaying,
                INTERACT_RANGE, updateTheaterProximity, startFirstFilm,
                get theaterZones() { return theaterZones; },
                get theaterVolume() { return theaterVolume; },
                get filmLibrary() { return filmLibrary; },
                get raycasterFar() { return raycaster.far; },
                get dimMultiplier() { return dimMultiplier; },
                toggleYtScreen, stopYtScreen, handleAction,
                tp(x, z, y = 0.11) {   // y is the capsule BASE, not the eye
                    playerCapsule.start.set(x, y, z);
                    playerCapsule.end.set(x, y + EYE_OFFSET, z);
                    camera.position.copy(playerCapsule.end);
                },
                look(x, y, z) { camera.lookAt(new THREE.Vector3(x, y, z)); }
            };
        }
    </script>
</body>
