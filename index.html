            g.arcTo(0, 0, w, 0, r);
            g.closePath();
            g.fill();
            const tex = new THREE.CanvasTexture(c);
            tex.minFilter = THREE.LinearFilter;   // no mipmaps, so the edge stays crisp
            return tex;
        }

        // hideWhenIdle: keep the plane invisible except while actually playing. Without it a
        // clip that hasn't started shows its frozen first frame, and a non-looping one is
        // left parked on its last frame forever after it finishes.
        // cornerRadius: world units; 0 leaves the panel square.
        // playOnce: once it has run to the end it never plays again this session — walking
        // away and back leaves it off. Only a page reload arms it again.
        function setupWallVideo(src, x, y, z, rotY, width, height, playWithin, fullVolumeAt,
                                loop = true, hideWhenIdle = false, cornerRadius = 0,
                                playOnce = false) {
            const video = document.createElement('video');
            video.src = src;
            video.loop = loop;
            video.playsInline = true;
            video.preload = 'auto';
            video.muted = false;
            // Starts at full when fullVolumeAt >= playWithin (no fade), otherwise ramped.
            video.volume = fullVolumeAt >= playWithin ? 1 : 0;

            const tex = new THREE.VideoTexture(video);
            tex.colorSpace = THREE.SRGBColorSpace;
            const matOpts = { map: tex, toneMapped: false };
            if (cornerRadius > 0) {
                // alphaMap needs transparent:true to have any effect. three.js reads the
                // mask's green channel, so white = keep, black = cut.
                matOpts.alphaMap = roundedAlphaMask(width, height, cornerRadius);
                matOpts.transparent = true;
            }
            const mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(width, height),
                new THREE.MeshBasicMaterial(matOpts)
            );
            mesh.position.set(x, y, z);
            mesh.rotation.y = rotY;
            if (hideWhenIdle) mesh.visible = false;
            scene.add(mesh);

            // startWithin mirrors playWithin here — wall panels have no reason to start
            // before they're audible, unlike the shaft billboard. It must be present all the
            // same: the play test reads this field, and a missing one compares as undefined
            // and never fires.
            const bb = { mesh, video, playWithin, fullVolumeAt, playing: false, fixed: true,
                         startWithin: playWithin, hideWhenIdle, playOnce, done: false };

            // A non-looping clip fires 'ended' while the player may still be standing there,
            // so react here rather than waiting for them to walk out of range.
            video.addEventListener('ended', () => {
                if (hideWhenIdle) mesh.visible = false;
                // playOnce latches it off for the rest of the session, so leaving and
                // coming back doesn't restart it. Cleared only by a page reload.
                if (playOnce) { bb.done = true; bb.playing = false; }
            });

            billboards.push(bb);
            return bb;
        }

        function playBillboard(bb) {
            bb.playing = true;
            // A non-looping clip that already finished sits parked on its last frame, so
            // play() would end instantly. Rewind first, and walking back into range replays
            // it from the top rather than showing a dead frame.
            if (bb.video.ended) bb.video.currentTime = 0;
            if (bb.hideWhenIdle) bb.mesh.visible = true;
            bb.video.play().catch(() => {
                // Autoplay refused with sound. Start it muted so the picture still runs, and
                // flag it so the next user gesture can turn the sound on — without this it
                // would stay silent for the rest of the session.
                bb.video.muted = true;
                bb.needsUnmute = true;
                bb.video.play().catch(() => { bb.playing = false; });
            });
        }

        // Any click or keypress counts as user activation, so take the first one after a
        // blocked autoplay and restore sound.
        ['pointerdown', 'keydown'].forEach(evt => window.addEventListener(evt, () => {
            for (const bb of billboards) {
                if (bb.needsUnmute) { bb.video.muted = false; bb.needsUnmute = false; }
            }
        }));

        // Inside the building under the fall shaft.
        // TEMPORARY: webmtest.webm is the audio test file — VP9 + alpha + Opus stereo.
        // scene1.webm is video-only (no audio stream at all), which is why nothing was
        // audible; swap the line back once scene1 is re-exported with sound.
        setupBillboardVideo(
            './VIDS/webmtest.webm',
            .60, -18.03, -36,   // position
            .9,                    // size        — plane is square; source is square too
            14,                     // playWithin  — volume is 0 here, ramping up as you close
            14,                    // fullVolumeAt— full volume once this close
            false,                  // loop        — off: it runs through once, not on repeat
            true,                   // playOnce    — and then never again this session
            null,                   // startWithin — unused; startBox governs the trigger
            14                       // startBox    — holds off until EVERY axis is within 5 of
                                    //   the panel at (1.16, -18, -19.17): a 10-unit cube, not
                                    //   a radius. The far corner of that cube is 8.66 away, so
                                    //   the playWithin 10 volume ramp is already under way the
                                    //   moment it starts, reaching full at 2.5.
        );

        // Welcome video, mounted flat on the Plane.001 wall (that wall spans x -1.30..1.30,
        // y -0.25..3.32 and sits at z 1.61..1.66, so this hangs 0.10 proud of it, facing +z —
        // back down the tunnel toward you). Source is 1350x1080, so 5:4 rather than 16:9.
        // Centred on y 0.40, which is eye height here, and sized so the bottom edge lands on
        // the floor rather than sinking through it.
        setupWallVideo(
            './VIDS/portfolio welcome v2.webm',
            0.00, 2.00, 1.76,       // position — 0.10 in front of the wall face
            0,                      // rotY     — faces +z, toward the approach
            1.8, 1.44,             // width, height — 5:4, matching the source (2x)
            // 3.85, not 3.50: the trigger is a radius from the panel, and raising it to
            // y 2.00 put it 1.60 above eye level, so the straight-line distance from the
            // z 5.26 mark grew from 3.50 to 3.85. This keeps it firing at that same spot.
            5,                   // playWithin
            5,                   // fullVolumeAt — equal to playWithin = no fade, full volume at once
            false,                  // loop        — plays once through
            true,                   // hideWhenIdle— invisible until it starts, gone once it ends
            0.2,                   // cornerRadius— world units; 0 for square corners
            true                   // playOnce    — never replays after it finishes once
        );

        // --- STILL-IMAGE FRAMES ---
        // Sized from the texture's own aspect once it loads, capped by maxW/maxH.
        function setupImageScreen(url, x, y, z, rotY, maxW = 0.7, maxH = 0.5) {
            let mesh, border;
            const tex = textureLoader.load(url, (t) => {
                const aspect = (t.image && t.image.width) ? t.image.width / t.image.height : 16 / 9;
                let w = maxW, h = maxW / aspect;
                if (h > maxH) { h = maxH; w = maxH * aspect; }
                mesh.geometry.dispose();
                mesh.geometry = new THREE.PlaneGeometry(w, h);
                border.geometry.dispose();
                border.geometry = new THREE.PlaneGeometry(w + 0.05, h + 0.05);
            });
            tex.colorSpace = THREE.SRGBColorSpace;

            mesh = new THREE.Mesh(
                new THREE.PlaneGeometry(maxW, maxH),
                new THREE.MeshBasicMaterial({ map: tex, toneMapped: false })
            );
            mesh.position.set(x, y, z);
            mesh.rotation.y = rotY;
            scene.add(mesh);

            border = new THREE.Mesh(
                new THREE.PlaneGeometry(maxW + 0.05, maxH + 0.05),
                new THREE.MeshBasicMaterial({ color: 0x000000, toneMapped: false })
            );
            border.position.copy(mesh.position);
            border.rotation.copy(mesh.rotation);
            border.translateZ(-0.006);
            scene.add(border);
            return mesh;
        }

        // --- PROJECT ROOMS ---
        // Eight rooms off the work hallway, each labelled by baked text in the .glb. Measured
        // from the model: floor y 0.01, EYE LEVEL 0.41, back wall x -7.53, front (door) wall
        // x -1.29, and every room 2.24 deep in z.
        //
        //   ROOM_Z      each room's z bounds, read off the model
        //   wall 'a'/'b'  the two long side walls; 'back' is the far wall facing the door
        //
        // Screens sit at eye level so you look straight at them — the wall runs 3.5m high but
        // anything mounted up there has to be viewed at an angle, which skews the picture.
        // The only limit on size is that a screen centred at eye level can't be taller than
        // twice the eye height before its bottom edge sinks through the floor, so the centre
        // is nudged up just enough to clear it.
        const ROOM_EYE   = 0.41;   // measured standing height in these rooms
        const ROOM_BACK_X = -7.53; // far wall
        const ROOM_X_FROM = -1.95; // screens start this far in from the door...
        const ROOM_X_TO   = -7.00; // ...and stop here, short of the back wall
        const ROOM_GAP    = 0.18;
        const ROOM_MAX_W  = 1.45;  // cap so a lone screen doesn't become a billboard

        // z bounds per room, straight from the model.
        const ROOM_Z = {
            'UNITED MILEAGE PLUS': [-2.24,  0.00],
            'QUIBI':               [-4.49, -2.25],
            'ADOBE ACROBAT':       [-6.74, -4.50],
            'GOOGLE':              [-8.99, -6.75],
            'THE CROWN':           [-11.24, -9.00],
            'CARS.COM':            [-13.49, -11.25],
            'SAMSUNG':             [-15.74, -13.50],
            'SEES CANDY':          [-17.99, -15.75],
        };

        // Rooms with three or more pieces run down both long walls so nothing has to shrink;
        // one or two pieces go on the back wall instead, where you meet them head-on walking
        // in — a lone screen stuck on a side wall reads as an afterthought.
        // ORDER: `videos[0]` hangs at the BACK of the room and the last entry nearest the
        // door. Walking in you face the wall looking down -z, so the door end is on your
        // RIGHT — which means the array reads left-to-right, and anything wanted "first on
        // the right" goes LAST. Verified against the built scene: index 0 lands at x -6.65,
        // the final entry at x -2.30, with the door wall at x -1.29.
        //
        // `back` is optional and hangs on the far wall facing the door, sized on its own
        // rather than sharing the room's width — see layoutWorkRoom.
        const WORK_ROOMS = [
            { name: 'UNITED MILEAGE PLUS',
              videos: ['JrFmHsX_7tA','CXP3F8tVRtk','2j3J6zEj3cY','OTZreN_R9yE','nxzJEyLHnXI','t_XBUVlP_YE'] },
            // Right to left: Quicksand, Train Tracks, Bank Heist, Most Dangerous Game.
            { name: 'QUIBI',
              videos: ['pBBLyat5qCc','Fq58J9wVXUc','Pyt8X7voCts','qrHWcKfWX7w'] },
            // Right to left: Baby Proof, Big Idea, then Puppy's Gotta Go / Daddy DIY /
            // Treehouse keeping the order they were already in.
            { name: 'ADOBE ACROBAT',
              videos: ['zme7UI8U6_4','WzzODSYkyL8','kGpgEqGMxU4','jfeFDxnNhts','bZHDIRr0ulg'] },
            // Google Fi and Google Maps share the one GOOGLE room, all six on the one side
            // wall. Right to left: Bad Coverage, Kitty Cat Cafe, Four Bills, the two :06
            // intent spots, then Maps on the far left of the run. Six across takes them all
            // to 0.69 rather than 0.87 — the row shares one width, so Maps joining it
            // narrows the Fi films too.
            //
            // Dropped here: both Insta Story Superzoom cuts (Zd7F3GVF5qw, GWHyEabX0yQ),
            // and lviuiGR9e1U — which was a second upload of the same Four Bills film
            // already present as wIN_QRE5owA, so the room was showing it twice.
            { name: 'GOOGLE',
              videos: ['adNqySKpQZk','Evgvf93C_C8','VEjsCn-9JoE','wIN_QRE5owA','8N_Hejf90BE','Ixr6Ag8qAfY'] },
            // Laid out by hand below — the film floats in the middle of the room facing the
            // door, with the campaign stills around it, so it takes no wall row here.
            { name: 'THE CROWN',  videos: [] },
            // Reversed: BEST CAR now leads on the right, VALENTINE_1 at the far end.
            { name: 'CARS.COM',
              videos: ['TKQgJSZ5Abg','RCyUYoQiwr4','LoFHGI31uHg','CobBwgeXcLE','Avfs6Y55daM'] },
            // One film, so it takes the back wall head-on at the full 1.45. The reaction
            // piece (gk9VACPUg6g) is not here — it plays on the classic laptop in the room,
            // wired up after the model loads.
            // On the SIDE wall facing +z like every other screen — NOT the back wall, which
            // is where a lone film lands by default and where this one kept ending up.
            // anchorX -4.40 puts it under the room's title (Text017) and immediately left of
            // the classic laptop, whose prop starts at x -3.50: a 0.18 gap at 1.45 wide.
            // Left rather than right because the door side only has 1.3m of run left, and
            // the film needs 1.45.
            { name: 'SAMSUNG',    videos: ['xQNUtrxiZBs'], side: true, anchorX: -4.40 },
            { name: 'SEES CANDY',
              videos: ['R6Whs70aXLg','9pyFfV3xsUs','HHTIkseopcM','LGrCeKWlqC4','U26ZECF1NHM'] },
        ];

        // Lay one row out along an axis, centred in the span, and hang it on the wall.
        //   axis 'x' -> a side wall at fixed z; axis 'z' -> the back wall at fixed x
        function layoutRow(videos, opts) {
            const { axis, fixed, from, to, rotY, width, y, centre } = opts;
            const n = videos.length;
            if (!n) return;
            const total = n * width + (n - 1) * ROOM_GAP;
            // `centre` overrides the midpoint of the span, for a row that has to line up
            // with something in the model rather than with the middle of the wall.
            const mid = centre !== undefined ? centre : (from + to) / 2;
            const first = mid - total / 2 + width / 2;
            const h = width * 9 / 16;
            videos.forEach((id, i) => {
                const at = first + i * (width + ROOM_GAP);
                if (axis === 'x') setupYouTubeScreen(id, at, y, fixed, rotY, width, h);
                else              setupYouTubeScreen(id, fixed, y, at, rotY, width, h);
            });
        }

        function layoutWorkRoom(room) {
            const [zMin, zMax] = ROOM_Z[room.name];
            const vids = room.videos;

            // Size every screen in a room the same, from whichever row is most crowded, so a
            // room reads as one set rather than a jumble of sizes.
            const sizeFor = (perRow, span) =>
                Math.min(ROOM_MAX_W, (span - (perRow - 1) * ROOM_GAP) / perRow);

            const sideSpan = ROOM_X_FROM - ROOM_X_TO;   // 5.05 along the long walls
            const backSpan = (zMax - zMin) - 0.34;      // 1.90 across the back wall

            // An explicit `back` list hangs on the far wall facing the door and switches off
            // the automatic overflow below. It is laid out AFTER the side row, because it
            // takes the side row's width — one room should read as one set, and Google Maps
            // at 1.45 next to Fi films at 0.87 read as a different piece of work rather than
            // the same campaign continued.
            const hasBack = !!(room.back && room.back.length);
            const layoutBackRow = (w) => {
                if (!hasBack) return;
                // Never wider than the back wall can take, whatever the side row is doing.
                const bw = Math.min(w, sizeFor(room.back.length, backSpan));
                layoutRow(room.back, {
                    axis: 'z', fixed: ROOM_BACK_X + 0.03, rotY: Math.PI / 2,
                    from: zMin + 0.17, to: zMax - 0.17,
                    width: bw, y: Math.max(ROOM_EYE + 0.05, (bw * 9 / 16) / 2 + 0.06),
                });
            };

            if (!vids.length) { layoutBackRow(sizeFor(1, backSpan)); return; }

            // `side` keeps a lone film on the near side wall facing +z with the rest of the
            // room, instead of taking the back wall side-on. SAMSUNG needs it: one film, but
            // it has to read in the same direction as every other screen in the space and
            // sit beside the classic laptop rather than round a corner from it.
            if (vids.length === 1 && !hasBack && !room.side) {
                // A single piece goes on the back wall, head-on as you walk in. On a side
                // wall it would sit off to one side and read as an afterthought.
                const w = sizeFor(1, backSpan);
                layoutRow(vids, {
                    axis: 'z', fixed: ROOM_BACK_X + 0.03, rotY: Math.PI / 2,
                    from: zMin + 0.17, to: zMax - 0.17,
                    width: w, y: Math.max(ROOM_EYE + 0.05, (w * 9 / 16) / 2 + 0.06),
                });
                return;
            }

            // ONLY the near side wall (rotY 0) and the back wall (rotY PI/2) are used.
            //
            // The far side wall would need rotY = PI, and a screen facing that way fails to
            // play: the hole-punch opens but the video paints as a thin cross-shaped sliver
            // instead of filling it. Verified it is specific to PI — rotY 0 and PI/2 both
            // play perfectly from the same code. Ruled out: the mesh (it projects as a
            // correct full rectangle), occlusion (a raycast across the face hits nothing but
            // the screen), z-fighting with the border and with the wall behind (pulling the
            // screen 12cm clear changed nothing), the CSS mirror at 180deg, and other
            // screens' containers painting over it. Cause still unknown, so the layout
            // avoids PI rather than pretending it works.
            //
            // Cost: one wall instead of two, so a busy room's screens are smaller than the
            // 1.45 they'd otherwise get. The back wall takes the overflow, capped at 2 — it
            // is only 1.90 wide against the side's 5.05, so a long run there shrinks the
            // whole room.
            // Six fit on the side wall, not five. UNITED MILEAGE PLUS has exactly six and
            // was spilling its last film onto the back wall, which read as an odd one out;
            // six across makes them 0.69 wide instead of 0.87, which is the trade. No other
            // room has more than five, so this changes nothing else.
            const ROOM_SIDE_MAX = 6;
            const backCount = hasBack ? 0 : Math.min(2, Math.max(0, vids.length - ROOM_SIDE_MAX));
            const a = vids.slice(0, vids.length - backCount);
            const c = backCount ? vids.slice(vids.length - backCount) : [];

            // One width for the whole room, taken from the most crowded run, so a room reads
            // as a single set rather than a jumble of sizes.
            let w = sizeFor(a.length, sideSpan);
            if (c.length) w = Math.min(w, sizeFor(c.length, backSpan));
            const y = Math.max(ROOM_EYE + 0.05, (w * 9 / 16) / 2 + 0.06);

            layoutBackRow(w);

            // Near side wall, at zMin, facing +z into the room.
            layoutRow(a, { axis: 'x', fixed: zMin + 0.03, rotY: 0,
                           from: ROOM_X_FROM, to: ROOM_X_TO, width: w, y,
                           centre: room.anchorX });
            if (c.length) {
                layoutRow(c, { axis: 'z', fixed: ROOM_BACK_X + 0.03, rotY: Math.PI / 2,
                               from: zMin + 0.17, to: zMax - 0.17, width: w, y });
            }
        }

        WORK_ROOMS.forEach(layoutWorkRoom);

        // A flat picture on a plane — no hole punch, no iframe, just a texture. Sized from
        // the image's own aspect so nothing is stretched, and put on PHOTO_LAYER so the
        // chromatic aberration leaves it alone, same as the photography carousel.
        function setupWallImage(url, x, y, z, rotY, width) {
            const mat = new THREE.MeshBasicMaterial({ toneMapped: false, transparent: true, opacity: 0 });
            const mesh = new THREE.Mesh(new THREE.PlaneGeometry(width, width * 0.66), mat);
            mesh.position.set(x, y, z);
            mesh.rotation.y = rotY;
            mesh.layers.enable(PHOTO_LAYER);
            scene.add(mesh);
            textureLoader.load(url, (tex) => {
                tex.colorSpace = THREE.SRGBColorSpace;
                const img = tex.image || {};
                const aspect = (img.width && img.height) ? img.width / img.height : 1.5;
                mesh.geometry.dispose();
                mesh.geometry = new THREE.PlaneGeometry(width, width / aspect);
                mat.map = tex;
                mat.opacity = 1;
                mat.needsUpdate = true;
            }, undefined, () => console.warn('[crown] missing image', url));
            return mesh;
        }

        // --- THE CROWN ---
        // Film on the wall at the same height as every other project screen, with the stills
        // gridded in equal blocks either side of it.
        //
        // Three measurements drive this and none of them are free choices:
        //   * the room's title, Text010, has its BOTTOM EDGE at y 0.91
        //   * the floor is at 0.01
        //   * the title sits 0.15m BEHIND the wall face the work hangs on, so anything here
        //     is the nearer of the two and projects higher than its own top edge. Sizing to
        //     the title's raw height is not enough — a still topping out at 0.89 still cuts
        //     across it on screen. 0.80 is the working ceiling.
        //
        // That leaves 0.79 of height, which is what caps the stills at 0.38 wide in two rows.
        // Bigger than that and the second row will not fit under the title.
        const CROWN_FILM = 'pLk95Bs0QZs';
        const CROWN_CEILING_Y = 0.80;      // clears the title once projection is accounted for
        const CROWN_FLOOR_Y = 0.01;
        const CROWN_AT_X = -4.40;          // from the title
        const CROWN_AT_Z = -11.21;         // wall face, the offset the side-wall rows use
        const CROWN_FACE = 0;              // +z, like every other project screen

        // Same width and the same eye-level formula the other rooms use, so it hangs at the
        // identical height to the screens in GOOGLE, ADOBE and the rest.
        const CROWN_FILM_W = 0.87;
        const CROWN_FILM_H = CROWN_FILM_W * 9 / 16;
        const CROWN_FILM_Y = Math.max(ROOM_EYE + 0.05, CROWN_FILM_H / 2 + 0.06);

        const CROWN_IMG_W = 0.38;          // was 0.24 — the old row read as a strip of stamps
        const CROWN_IMG_GAP_X = 0.08;
        const CROWN_IMG_GAP_Y = 0.05;
        const CROWN_TOP_COLS = 4;          // 4 over 3 per side: 7 each, 14 in all
        const CROWN_BOT_COLS = 3;
        const CROWN_DIR = './IMAGES/crown/';
        const CROWN_STILLS = [
            'Cannes-image.webp', 'biscuits.webp', 'cabbage-2.webp', 'coaster.webp',
            'generic.webp', 'gin-bottle-3.webp', 'land-rover.webp', 'pepper-grinder.webp',
            'pet-aisle.webp', 'robinson-1.webp', 'robinsons-2.webp', 'sony-1.webp',
            'taxi-2.webp', 'zoo.webp',
        ];

        setupYouTubeScreen(CROWN_FILM, CROWN_AT_X, CROWN_FILM_Y, CROWN_AT_Z,
                           CROWN_FACE, CROWN_FILM_W, CROWN_FILM_H);

        (() => {
            // The squarest still (the Cannes badge, near 1:1) sets the row height — sizing on
            // the average would let that one break the ceiling.
            const rowH = CROWN_IMG_W / 1.04;
            const blockH = rowH * 2 + CROWN_IMG_GAP_Y;
            const midY = (CROWN_FLOOR_Y + CROWN_CEILING_Y) / 2;
            const topY = midY + (rowH + CROWN_IMG_GAP_Y) / 2;
            const botY = midY - (rowH + CROWN_IMG_GAP_Y) / 2;

            // Each side gets the gap between the film's edge and the end of the screen run.
            const filmL = CROWN_AT_X - CROWN_FILM_W / 2;
            const filmR = CROWN_AT_X + CROWN_FILM_W / 2;
            const sides = [
                { from: ROOM_X_TO,   to: filmL },   // -7.00 .. film's left edge
                { from: filmR,       to: ROOM_X_FROM },
            ];

            const step = CROWN_IMG_W + CROWN_IMG_GAP_X;
            let n = 0;
            for (const side of sides) {
                const centre = (side.from + side.to) / 2;
                for (const [cols, y] of [[CROWN_TOP_COLS, topY], [CROWN_BOT_COLS, botY]]) {
                    // Rows are centred on the same axis, so the 3 sits centred under the 4.
                    const first = centre - ((cols - 1) * step) / 2;
                    for (let c = 0; c < cols; c++) {
                        const file = CROWN_STILLS[n++];
                        if (!file) return;
                        setupWallImage(CROWN_DIR + file, first + c * step, y, CROWN_AT_Z,
                                       CROWN_FACE, CROWN_IMG_W);
                    }
                }
            }
        })();


        // Google Maps ('adNqySKpQZk') now hangs on the GOOGLE room's back wall — see the
        // `back` entry in WORK_ROOMS. It was a corridor poster before, which was wrong: a
        // playing screen hole-punches its wall so the video iframe shows through, and on the
        // corridor divider that opened a window into the Adobe Acrobat room behind.


        // --- MAIN THEATER PLACEMENT ---
        // The main theater is the full experience: the scrollable film carousel, the poster
        // thumbnails, click-to-watch, the MENU button, auto-advance. It carries every short
        // and cartoon (VIMEO_VIDEO_IDS + YOUTUBE_VIDEO_IDS, ordered by FILM_ORDER).
        //
        // WORLD CONFIG — it is placed on a marker object in the .glb rather than by hand, so
        // moving or resizing that object in Blender moves the whole theater, UI and all.
        const MAIN_THEATER_MARKER = 'theater_1_screen';
        // The screen is turned to face the centre of this object — the room it hangs in.
        // A slab's own vertex normals are not a reliable guide: once the marker exports as
        // several primitives, the first vertex can belong to an edge rather than the screen
        // face, which is what silently flipped the facing axis and shrank the screen to its
        // own 0.73 thickness. The room is unambiguous.
        const MAIN_THEATER_ROOM = 'theater_1_space';
        // Used only if the marker is missing from the export, so the theater still exists.
        const MAIN_THEATER_FALLBACK = { position: [0, 1.50, 1.58], rotY: Math.PI, width: 2.40 };

        // --- THEATER PROXIMITY — TUNING KNOBS ---
        // Walking into the tunnel starts the first film and fades its audio up; the room
        // itself plays at full volume. Both zones are read from the model, so they track
        // whatever you build in Blender — you move the tunnel/room objects, not numbers here.
        //
        //   THEATER_AUTOPLAY      does walking in start a film at all
        //   THEATER_TRIGGER_PAD   HOW EARLY it starts — metres the trigger zone is grown by
        //   THEATER_TUNNEL_VOLUME how loud it is at the far end of the tunnel
        //   THEATER_REACH_MARGIN  HOW CLOSE you must be for the controls to work
        //
        // Which object in the .glb is the tunnel you walk through.
        const THEATER_TUNNEL_MESH = 'theater_1_tunnel';

        // How early the film starts. The tunnel is a tight box, so grow it a little — at
        // walking speed with 5 physics substeps you can otherwise clip a corner and miss the
        // trigger entirely. Raise this to start the film further out, lower it to make you
        // walk deeper in first. To move the trigger a long way, resize the tunnel object in
        // Blender instead — this is a nudge, not a replacement for the zone.
        const THEATER_TRIGGER_PAD = 0.30;

        // Volume at the far (door) end of the tunnel, ramping to 1.0 at the room mouth.
        const THEATER_TUNNEL_VOLUME = 0.15;

        const THEATER_AUTOPLAY = true;

        // ---- THE TWO DISTANCE KNOBS ----
        // Both take metres. Set either to null to fall back to the automatic behaviour
        // (tunnel-zone trigger / room-corner-derived reach).

        // HOW CLOSE TO GET FOR IT TO START.
        // null = ZONE MODE, the behaviour in use: the film starts the moment you enter the
        // tunnel or room, and volume ramps from THEATER_TUNNEL_VOLUME at the tunnel door up
        // to 1.0 at the room, sliding back down as you walk out. Grow or shrink the trigger
        // with THEATER_TRIGGER_PAD, or resize the tunnel object in Blender.
        //
        // Set a number instead for DISTANCE MODE: a plain radius around the screen, which
        // REPLACES the zone test rather than adding to it — the room box here is 22x18x38m,
        // so OR-ing the two would leave the radius doing nothing.
        const THEATER_START_DISTANCE = null;

        // Distance at which the film is at full volume; it fades from silent at
        // THEATER_START_DISTANCE down to this. DISTANCE MODE ONLY — ignored while
        // THEATER_START_DISTANCE is null.
        const THEATER_FULL_VOLUME_DISTANCE = 20;

        // HOW FAR IT STAYS CONTROLLABLE.
        // Distance from the screen within which the screen, carousel, thumbnails and MENU
        // button respond. null = derive it from the room (screen to furthest room corner
        // plus THEATER_REACH_MARGIN), which on this model works out at 32m — big enough
        // that the controls answer from most of the level, hence this override.
        // raycaster.far is raised to match either way, so this can't silently overshoot.
        const THEATER_CONTROL_REACH = 20;

        // Only used when THEATER_CONTROL_REACH is null — slack added to the derived reach.
        const THEATER_REACH_MARGIN = 2;

        let theaterZones = null;         // { tunnel: Box3, room: Box3, rampLength }
        let theaterInDomain = false;      // edge-trigger for autoplay
        let theaterVolume = 1;            // 0..1, driven by distance
        let theaterVolumeApplied = -1;    // last value actually pushed to a player

        // The theater's own audio level. Players are told this rather than a flat 100%, so
        // starting or resuming a film doesn't blast at full volume before the proximity
        // ramp catches up on the next frame.
        function currentTheaterVolume() {
            return theaterZones ? THREE.MathUtils.clamp(theaterVolume, 0, 1) : 1;
        }

        function applyTheaterVolume(force) {
            const v = currentTheaterVolume();
            if (!force && Math.abs(v - theaterVolumeApplied) < 0.01) return;
            theaterVolumeApplied = v;
            if (vimeoPlayer) { try { vimeoPlayer.setVolume(v).catch(() => {}); } catch (e) {} }
            if (youtubePlayer) { try { youtubePlayer.setVolume(Math.round(v * 100)); } catch (e) {} }
        }

        // Stop whatever the theater is playing and return it to the carousel. Called when
        // the player walks out of the tunnel, so a film isn't left running in an empty room.
        //
        // The MENU button only pauses, which is right when you're standing there and might
        // resume. Leaving is different: the embed is destroyed and its markup cleared, so
        // the player stops buffering and there's no chance of stray audio following you
        // down the corridor.
        function stopTheaterPlayback() {
            if (!masterScreen || !cssObject) return;
            if (!playbackGroup || !playbackGroup.visible) return;   // already on the menu

            destroyCurrentPlayer();
            cssObject.element.innerHTML = '';
            cssObject.visible = false;

            screenMat.colorWrite = true;
            screenMat.transparent = true;
            screenMat.opacity = 0.5;

            menuGroup.visible = true;
            playbackGroup.visible = false;
            raycaster.layers.set(1);
            isVideoPaused = true;   // dimMultiplier follows from this, via filmIsPlaying()
        }

        // The theater runs from the moment the game starts rather than waiting for you to
        // walk in; proximity then governs volume only. Two things have to be true and they
        // can land in either order — the world has been entered (which is also what grants
        // autoplay permission for the embedded players), and the film library has finished
        // loading — so both paths call this and whichever is last actually starts it.
        let gameStarted = false;
        function startTheaterIfReady() {
            if (!gameStarted || !THEATER_AUTOPLAY) return;
            startFirstFilm();
        }

        // Films that stay in the carousel and play fine when picked, but are never what the
        // theater opens on by itself. By ID, for the same reason FILM_ORDER is — a retitle
        // upstream would silently undo a title match.
        const NOT_AUTO_PLAYED = [
            '380320579',      // RUNNING WITH REGIS
        ];

        // A random playable entry, so walking in twice doesn't open on the same short.
        // filmLibrary[0] is the "scroll for options" instruction card, which has no video
        // behind it, so it's filtered out rather than indexed around.
        function startFirstFilm() {
            if (!masterScreen || !cssObject || !filmLibrary.length) return;
            if (playbackGroup && playbackGroup.visible) return;   // something already up
            const playable = [];
            filmLibrary.forEach((f, i) => {
                if (f.source === 'instruction') return;
                if (NOT_AUTO_PLAYED.includes(String(f.id))) return;
                playable.push(i);
            });
            if (!playable.length) return;
            playFilm(playable[Math.floor(Math.random() * playable.length)]);
        }

        function updateTheaterProximity() {
            if (!theaterZones) return;
            const p = playerCapsule.start;
            let inDomain, target = 0;

            if (THEATER_START_DISTANCE !== null && theaterPlacement) {
                // DISTANCE MODE — a plain radius around the screen, tuned by the two
                // constants up top. Silent at THEATER_START_DISTANCE, full volume once
                // inside THEATER_FULL_VOLUME_DISTANCE, linear between.
                const d = theaterPlacement.position.distanceTo(p);
                inDomain = d <= THEATER_START_DISTANCE;
                if (inDomain) {
                    const span = Math.max(0.001, THEATER_START_DISTANCE - THEATER_FULL_VOLUME_DISTANCE);
                    target = THREE.MathUtils.clamp((THEATER_START_DISTANCE - d) / span, 0, 1);
                }
            } else {
                // ZONE MODE — the original behaviour. Full volume in the room; along the
                // tunnel it ramps by how close the player is to the room, bottoming out at
                // THEATER_TUNNEL_VOLUME; silent outside.
                const inRoom = theaterZones.room.containsPoint(p);
                const inTunnel = !inRoom && theaterZones.tunnel.containsPoint(p);
                inDomain = inRoom || inTunnel;
                if (inRoom) {
                    target = 1;
                } else if (inTunnel) {
                    const d = theaterZones.room.distanceToPoint(p);
                    const t = 1 - THREE.MathUtils.clamp(d / theaterZones.rampLength, 0, 1);
                    target = THREE.MathUtils.lerp(THEATER_TUNNEL_VOLUME, 1, t);
                }
            }

            // The film is started once at game start (see startTheaterIfReady) and then left
            // running, so this no longer starts or tears anything down — it only tracks the
            // zone edge in order to snap the volume on entry rather than sliding up to it.
            if (inDomain && !theaterInDomain) {
                theaterInDomain = true;
                theaterVolume = target;
                applyTheaterVolume(true);
            } else if (!inDomain) {
                theaterInDomain = false;
            }

            theaterVolume = THREE.MathUtils.lerp(theaterVolume, target, 0.12);
            applyTheaterVolume();
        }

        // The screen geometry is `currentScreenWidth` units wide in local space (16 for a
        // 16:9 film), so world width = currentScreenWidth * SCREEN_SCALE. Derived from the
        // marker in applyTheaterPlacement(), hence `let`.
        let SCREEN_SCALE = MAIN_THEATER_FALLBACK.width / 16;
        let theaterPlacement = null;   // {position, rotY, width} — set once the model loads

        // Position the theater and size its CSS panel. Safe to call before setupTheater has
        // run (it no-ops) and safe to call twice — the model load and the oEmbed fetches
        // race, so whichever finishes last does the real work.
        function applyTheaterPlacement() {
            if (!masterScreen) return;
            const p = theaterPlacement;
            const pos = p ? p.position : new THREE.Vector3().fromArray(MAIN_THEATER_FALLBACK.position);
            const rotY = p ? p.rotY : MAIN_THEATER_FALLBACK.rotY;
            SCREEN_SCALE = (p ? p.width : MAIN_THEATER_FALLBACK.width) / 16;

            masterScreen.position.copy(pos);
            masterScreen.rotation.set(0, rotY, 0);
            masterScreen.scale.set(SCREEN_SCALE, SCREEN_SCALE, SCREEN_SCALE);

            if (cssObject) {
                cssObject.position.copy(masterScreen.position);
                cssObject.rotation.copy(masterScreen.rotation);
                cssObject.translateZ(0.03);
                syncTheaterCssPanel();
            }
        }

        // Keep the CSS3D panel exactly the size of the hole punched in the screen.
        // The panel width follows currentScreenWidth; its HEIGHT has to follow
        // currentScreenHeight too. It used to be pinned at 1280x720, which is only correct
        // for 16:9 films — anything else (a 4:3 short, say) left part of the hole
        // transparent and showed the page's body gradient through it as coloured bands.
        function syncTheaterCssPanel() {
            if (!cssObject) return;
            const cssScale = (currentScreenWidth * SCREEN_SCALE) / 1280;
            cssObject.scale.set(cssScale, cssScale, cssScale);
            cssObject.element.style.width = '1280px';
            cssObject.element.style.height =
                Math.round(1280 * (currentScreenHeight / currentScreenWidth)) + 'px';
        }

        // --- Vimeo oEmbed Fetch (public, keyless) ---
        async function fetchVimeoVideos() {
            const results = await Promise.all(VIMEO_VIDEO_IDS.map(async (id) => {
                try {
                    const url = 'https://vimeo.com/api/oembed.json?url=' + encodeURIComponent('https://vimeo.com/' + id) + '&width=640';
                    const response = await fetch(url);
                    const v = await response.json();
                    // The oEmbed html carries the real player src (incl. privacy hash for unlisted videos)
                    const srcMatch = (v.html || '').match(/src="([^"]+)"/);
                    return {
                        id: String(id),
                        title: (v.title || '').toUpperCase(),
                        embedUrl: srcMatch ? srcMatch[1] : `https://player.vimeo.com/video/${id}`,
                        thumb: v.thumbnail_url || '',
                        width: v.width || 1920,
                        height: v.height || 1080,
                        source: 'vimeo'
                    };
                } catch (err) {
                    console.warn('Vimeo oEmbed failed for', id, err);
                    return null;
                }
            }));
            return results.filter(Boolean);
        }

        // --- YouTube oEmbed Fetch (public, keyless) ---
        async function fetchYouTubeVideos() {
            const results = await Promise.all(YOUTUBE_VIDEO_IDS.map(async (id) => {
                try {
                    const url = 'https://www.youtube.com/oembed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + id) + '&format=json';
                    const response = await fetch(url);
                    const v = await response.json();
                    return {
                        id,
                        title: (v.title || '').toUpperCase(),
                        embedUrl: `https://www.youtube.com/embed/${id}`,
                        thumb: `https://img.youtube.com/vi/${id}/hqdefault.jpg`,
                        width: 1920,
                        height: 1080,
                        source: 'youtube'
                    };
                } catch (err) {
                    console.warn('YouTube oEmbed failed for', id, err);
                    return null;
                }
            }));
            return results.filter(Boolean);
        }

        // --- Screen Aspect Updater ---
        function updateScreenAspect(vidWidth, vidHeight) {
            if (!vidWidth || !vidHeight) return;
            const aspect = vidWidth / vidHeight;

            let targetWidth = 9 * aspect;
            let targetHeight = 9;

            if (targetWidth > 16) {
                targetWidth = 16;
                targetHeight = 16 / aspect;
            }

            currentScreenWidth = targetWidth;
            currentScreenHeight = targetHeight;

            masterScreen.geometry.dispose();
            masterScreen.geometry = new THREE.BoxGeometry(currentScreenWidth, currentScreenHeight, 0.2);

            menuHitbox.geometry.dispose();
            menuHitbox.geometry = new THREE.PlaneGeometry(currentScreenWidth, currentScreenHeight);

            const halfHeight = currentScreenHeight / 2;

            if (backBtn) {
                backBtn.position.x = 0;
                backBtn.position.y = 0;
            }

            // Resizes the CSS panel to match the new hole, height included.
            syncTheaterCssPanel();
        }

        // --- Destroy current player ---
        function destroyCurrentPlayer() {
            if (vimeoPlayer) {
                try { vimeoPlayer.destroy().catch(e => {}); } catch (err) {}
                vimeoPlayer = null;
            }
            if (youtubePlayer) {
                try { youtubePlayer.destroy(); } catch (err) {}
                youtubePlayer = null;
            }
        }

        // --- Init Vimeo Player API ---
        function initVimeoPlayer() {
            if (vimeoPlayer) return;
            const iframe = cssObject.element.querySelector('iframe');
            if (window.Vimeo && window.Vimeo.Player && iframe) {
                vimeoPlayer = new Vimeo.Player(iframe);
                vimeoPlayer.on('play', () => {
                    isVideoPaused = false;
                    // Match the proximity ramp rather than jumping to full — see
                    // currentTheaterVolume(). Was setVolume(1).
                    applyTheaterVolume(true);
                });
                vimeoPlayer.on('pause', () => {
                    isVideoPaused = true;
                });
                vimeoPlayer.on('ended', () => {
                    advanceToNextFilm();
                });
            }
        }

        // --- Init YouTube Player API ---
        function initYouTubePlayer() {
            if (youtubePlayer) return;
            if (!ytApiReady || !window.YT) return;
            const iframe = cssObject.element.querySelector('iframe');
            if (iframe) {
                // This one IS the theater, so it takes the proximity level rather than full.
                youtubePlayer = new window.YT.Player(iframe, {
                    events: {
                        'onReady': (e) => { applyPlayerPrefs(e.target, currentTheaterVolume() * 100); e.target.playVideo(); },
                        'onStateChange': (e) => {
                            if (e.data === window.YT.PlayerState.PLAYING) {
                                isVideoPaused = false;
                                applyPlayerPrefs(e.target, currentTheaterVolume() * 100);
                            } else if (e.data === window.YT.PlayerState.PAUSED) {
                                isVideoPaused = true;
                            } else if (e.data === window.YT.PlayerState.ENDED) {
                                advanceToNextFilm();
                            }
                        }
                    }
                });
            }
        }

        // --- Advance to next film ---
        function advanceToNextFilm() {
            let attempts = 0;
            while (attempts < filmLibrary.length) {
                currentFilmIndex = (currentFilmIndex + 1) % filmLibrary.length;
                const next = filmLibrary[currentFilmIndex];
                // NOT_AUTO_PLAYED is skipped here too: "only when someone picks it" has to
                // cover rolling onto it at the end of the previous short, not just the
                // opening pick. Choosing it from the carousel calls playFilm directly and
                // is unaffected.
                if (next && next.source !== 'instruction'
                         && !NOT_AUTO_PLAYED.includes(String(next.id))) {
                    playFilm(currentFilmIndex);
                    break;
                }
                attempts++;
            }
        }

        // --- Play a film by index ---
        function playFilm(index) {
            const film = filmLibrary[index];
            if (film.source === 'instruction') return;  // instruction thumbnail isn't playable
            currentFilmIndex = index;
            currentFilmSource = film.source;

            destroyCurrentPlayer();

            updateScreenAspect(film.width, film.height);

            screenMat.colorWrite = false;
            screenMat.transparent = false;

            if (film.source === 'youtube') {
                const origin = encodeURIComponent(window.location.origin);
                const embedSrc = `${film.embedUrl}?enablejsapi=1&origin=${origin}&autoplay=1&rel=0&playsinline=1&cc_load_policy=0`;
                cssObject.element.innerHTML = `
                    <div style="width:100%;height:100%;position:relative;">
                        <iframe src="${embedSrc}" frameborder="0"
                                allow="autoplay; fullscreen; encrypted-media"
                                allowfullscreen playsinline
                                style="position:absolute;top:0;left:0;width:100%;height:100%;"
                                title="${film.title}"></iframe>
                    </div>
                `;
                cssObject.visible = true;
                initYouTubePlayer();
            } else {
                const separator = film.embedUrl.includes('?') ? '&' : '?';
                const embedSrc = film.embedUrl + separator + 'autopause=0&badge=0&autoplay=1&player_id=0&playsinline=1';
                cssObject.element.innerHTML = `
                    <div style="width:100%;height:100%;position:relative;">
                        <iframe src="${embedSrc}" frameborder="0"
                                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share"
                                referrerpolicy="strict-origin-when-cross-origin"
                                allowfullscreen playsinline
                                style="position:absolute;top:0;left:0;width:100%;height:100%;"
                                title="${film.title}"></iframe>
                    </div>
                `;
                cssObject.visible = true;
                initVimeoPlayer();
            }

            menuGroup.visible = false;
            playbackGroup.visible = true;
            raycaster.layers.set(2);
            isVideoPaused = false;   // dimMultiplier follows from this, via filmIsPlaying()

            resetPlayerIdle();
        }

        function setupTheater() {
            screenMat = new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.5, toneMapped: false });
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 1 });

            const screenGeo = new THREE.BoxGeometry(currentScreenWidth, currentScreenHeight, 0.2);
            masterScreen = new THREE.Mesh(screenGeo, [blackMat, blackMat, blackMat, blackMat, screenMat, blackMat]);
            masterScreen.userData = { type: 'video_surface' };
            masterScreen.renderOrder = -1;
            masterScreen.layers.enable(2);
            scene.add(masterScreen);

            const videoContainer = document.createElement('div');
            videoContainer.style.width = '1280px';
            videoContainer.style.height = '720px';
            videoContainer.style.backgroundColor = '#000000';
            videoContainer.style.pointerEvents = 'none';
            videoContainer.innerHTML = '';

            cssObject = new CSS3DObject(videoContainer);
            cssObject.visible = false;
            scene.add(cssObject);
            // Transform, scale and CSS panel size are all set here — and again whenever the
            // model finishes loading, since the two are racing.
            applyTheaterPlacement();

            menuHitbox = new THREE.Mesh(new THREE.PlaneGeometry(currentScreenWidth, 9), new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0 }));
            menuHitbox.position.set(0, 0, 0.1);
            menuHitbox.userData = { type: 'menu_hitbox' };
            menuHitbox.layers.set(1);
            menuGroup.add(menuHitbox);

            filmLibrary.forEach((film, i) => {
                const tex = textureLoader.load(film.thumb, (loadedTex) => {
                    if (loadedTex.image && loadedTex.image.width) {
                        const aspect = loadedTex.image.width / loadedTex.image.height;
                        const w = 4.2 * aspect;
                        btn.geometry.dispose();
                        btn.geometry = new THREE.PlaneGeometry(w, 4.2);
                    }
                });
                tex.colorSpace = THREE.SRGBColorSpace;
                const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, toneMapped: false });
                const btn = new THREE.Mesh(new THREE.PlaneGeometry(7.5, 4.2), mat);
                const offset = i - currentFilmIndex;
                btn.position.set(offset * 4.8, 0, 0.2 - (Math.abs(offset) * 0.05));
                btn.userData = { type: 'select_film', index: i };
                btn.layers.set(1);
                menuGroup.add(btn);
                menuThumbnails.push(btn);
            });
            masterScreen.add(menuGroup);

            const backBtnTex = textureLoader.load('./ui/CLICK FOR MORE VIDEOS.png');
            backBtnTex.colorSpace = THREE.SRGBColorSpace;
            const backBtnMat = new THREE.ShaderMaterial({
                uniforms: {
                    map: { value: backBtnTex },
                    opacity: { value: 0 },
                    hueShift: { value: 0 }
                },
                vertexShader: `
                    varying vec2 vUv;
                    void main() {
                        vUv = uv;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform sampler2D map;
                    uniform float opacity;
                    uniform float hueShift;
                    varying vec2 vUv;

                    vec3 rgb2hsl(vec3 c) {
                        float mx = max(c.r, max(c.g, c.b));
                        float mn = min(c.r, min(c.g, c.b));
                        float l = (mx + mn) * 0.5;
                        if (mx == mn) return vec3(0.0, 0.0, l);
                        float d = mx - mn;
                        float s = l > 0.5 ? d / (2.0 - mx - mn) : d / (mx + mn);
                        float h;
                        if (mx == c.r) h = (c.g - c.b) / d + (c.g < c.b ? 6.0 : 0.0);
                        else if (mx == c.g) h = (c.b - c.r) / d + 2.0;
                        else h = (c.r - c.g) / d + 4.0;
                        h /= 6.0;
                        return vec3(h, s, l);
                    }

                    float hue2rgb(float p, float q, float t) {
                        if (t < 0.0) t += 1.0;
                        if (t > 1.0) t -= 1.0;
                        if (t < 1.0/6.0) return p + (q - p) * 6.0 * t;
                        if (t < 1.0/2.0) return q;
                        if (t < 2.0/3.0) return p + (q - p) * (2.0/3.0 - t) * 6.0;
                        return p;
                    }

                    vec3 hsl2rgb(vec3 c) {
                        if (c.y == 0.0) return vec3(c.z);
                        float q = c.z < 0.5 ? c.z * (1.0 + c.y) : c.z + c.y - c.z * c.y;
                        float p = 2.0 * c.z - q;
                        return vec3(
                            hue2rgb(p, q, c.x + 1.0/3.0),
                            hue2rgb(p, q, c.x),
                            hue2rgb(p, q, c.x - 1.0/3.0)
                        );
                    }

                    void main() {
                        vec4 tex = texture2D(map, vUv);
                        vec3 hsl = rgb2hsl(tex.rgb);
                        hsl.x = fract(hsl.x + hueShift);
                        vec3 shifted = hsl2rgb(hsl);
                        gl_FragColor = vec4(shifted, tex.a * opacity);
                    }
                `,
                transparent: true,
                toneMapped: false
            });
            backBtn = new THREE.Mesh(new THREE.PlaneGeometry(6, 3), backBtnMat);
            backBtn.position.set(0, 0, 1.5);
            backBtn.userData = { type: 'back_menu', label: 'MENU' };
            backBtn.layers.set(2);
            playbackGroup.add(backBtn);

            playbackGroup.visible = false;
            masterScreen.add(playbackGroup);

            camera.layers.enable(0);
            camera.layers.enable(1);
            camera.layers.enable(2);

            raycaster.layers.set(1);

            camera.position.copy(playerCapsule.end);
            // WORLD CONFIG — aim down the corridor on entry rather than at the theater screen,
            // which from the far-end spawn would start you staring at a wall 11m away.
            // OLD: camera.lookAt(masterScreen.position)
            camera.lookAt(SPAWN_LOOK);
        }


        // --- 4.7. ATMOSPHERICS & EFFECTS ---
        function setupEffects() {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const gradient = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            gradient.addColorStop(0, 'rgba(255,255,255,1)');
            gradient.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, 32, 32);
            const circleTexture = new THREE.CanvasTexture(canvas);

            const particleCount = 2000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(particleCount * 3);
            const vel = [];

            for (let i = 0; i < particleCount; i++) {
                pos[i * 3] = (Math.random() - 0.5) * 30;
                pos[i * 3 + 1] = Math.random() * 10;
                pos[i * 3 + 2] = (Math.random() - 0.5) * 30;

                vel.push({
                    x: (Math.random() - 0.5) * 0.02,
                    y: -(Math.random() * 0.08 + 0.02),
                    z: (Math.random() - 0.5) * 0.02
                });
            }

            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            const pMat = new THREE.PointsMaterial({
                color: 0xffffff,
                size: 0.06,
                map: circleTexture,
                transparent: true,
                opacity: DUST_OPACITY,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            particleSystem = new THREE.Points(geo, pMat);
            particleSystem.userData = { velocities: vel };
            scene.add(particleSystem);
        }
        setupEffects();

        // --- 4.8. IDLE TIMER ---
        let playerIdleTimeout;
        let isPlayerIdle = false;

        function resetPlayerIdle() {
            isPlayerIdle = false;
            const crosshair = document.getElementById('crosshair');
            if (crosshair) crosshair.style.opacity = '1';

            clearTimeout(playerIdleTimeout);

            if (playbackGroup && playbackGroup.visible && !isVideoPaused) {
                playerIdleTimeout = setTimeout(() => {
                    if (playbackGroup.visible && !isVideoPaused) {
                        isPlayerIdle = true;
                        if (crosshair) crosshair.style.opacity = '0';
                    }
                }, 1000);
            }
        }

        // --- 5. INTERACTION ---
        // How close you have to be for a given interactable to respond, by userData.type.
        // Small wall screens want a short reach so you don't trigger the one behind you;
        // a theater screen is a cinema screen viewed from across a 6.4m room, so it needs
        // far more. Kept in one place so handleAction and the hover prompt can't disagree
        // — they used to carry the same numbers separately.
        // NOTE: raycaster.far caps all of these, so it must be >= the largest.
        // The main theater's parts (the screen surface, the carousel hitbox, the film
        // thumbnails and the MENU button) sit in a 6.4m room, so they need the same long
        // reach as a standalone theater screen — at 4 you couldn't browse from the back row.
        const INTERACT_RANGE = {
            yt_screen: 2.5, local_screen: 2.5,
            vimeo_screen: 8,
            video_surface: 8, menu_hitbox: 8, select_film: 8, back_menu: 8,
            _default: 4,
        };
        const interactRange = (type) => INTERACT_RANGE[type] ?? INTERACT_RANGE._default;

        function handleAction(hit) {
            const data = hit.object.userData;
            const dist = hit.distance;

            if (dist > interactRange(data.type)) return;

            if (data.type === 'select_film') {
                playFilm(data.index);
            }
            else if (data.type === 'menu_hitbox') {
                playFilm(currentFilmIndex);
            }
            else if (data.type === 'video_surface') {
                if (currentFilmSource === 'youtube' && youtubePlayer) {
                    const state = youtubePlayer.getPlayerState();
                    if (state === window.YT.PlayerState.PLAYING) {
                        youtubePlayer.pauseVideo();
                    } else {
                        youtubePlayer.playVideo();
                    }
                } else if (currentFilmSource === 'vimeo' && vimeoPlayer) {
                    if (isVideoPaused) {
                        vimeoPlayer.play().catch(e => console.warn("Vimeo play error:", e));
                    } else {
                        vimeoPlayer.pause().catch(e => console.warn("Vimeo pause error:", e));
                    }
                }
            }
            else if (data.type === 'back_menu' && (backBtn.material.uniforms ? backBtn.material.uniforms.opacity.value : backBtn.material.opacity) > 0.5) {
                if (currentFilmSource === 'youtube' && youtubePlayer) {
                    youtubePlayer.pauseVideo();
                } else if (vimeoPlayer) {
                    vimeoPlayer.pause().catch(e => {});
                }

                cssObject.visible = false;
                screenMat.colorWrite = true;
                screenMat.transparent = true;
                screenMat.opacity = 0.5;

                menuGroup.visible = true;
                playbackGroup.visible = false;
                raycaster.layers.set(1);
                isVideoPaused = true;   // dimMultiplier follows from this, via filmIsPlaying()
            }

            else if (data.type === 'yt_screen') {
                const screen = ytScreens.find(s => s.videoId === data.videoId);
                if (screen) toggleYtScreen(screen);
            }

            else if (data.type === 'local_screen') {
                // Matched on the MESH, not on videoSrc. Two screens can legitimately show the
                // same file — the Slavic TV plays the same clip as the panel down the hall —
                // and a videoSrc lookup returns whichever was registered first, so clicking
                // one toggled the other one across the map.
                const screen = localScreens.find(s => s.mesh === hit.object)
                            || localScreens.find(s => s.videoSrc === data.videoSrc);
                if (screen) toggleLocalScreen(screen);
            }

            else if (data.type === 'vimeo_screen') {
                const screen = vimeoScreens.find(s => s.videoId === data.videoId);
                if (screen) toggleVimeoScreen(screen);
            }

        }

        // --- 5.5. AUDIO ---
        const fart5 = new Audio('./ui/Fart 5.mp3');

        let superJumpCount = 0;

        function initAudio() {}

        // the first one off to restart for the second. Built lazily on first use so a door
        // that never opens costs nothing.
        const DOOR_SFX = './audio/door opening2.mp3';
        const DOOR_SFX_VOLUME = 0.55;

        function playDoorSound(door) {
            if (!door.sfx) {

            door.sfx.play().catch(e => {});

        function playSuperJumpSound() {
            const snd = (superJumpCount % 3 < 2) ? fart5 : fart6;

        // --- MOBILE DETECTION ---
        const isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth < 1024);
        let mobileActive = false;

        const controls = new PointerLockControls(camera, renderer.domElement);

        const instructions = document.getElementById('instructions');
        // --- Interaction prompts -------------------------------------------------------
        // One line at the top of the screen that shows itself when it has something NEW to
        // say and then gets out of the way.
        //
        // The timer restarts only when the WORDING changes, never on a repeat. The old HUD
        // prompt was rewritten every frame from the raycast, so keying the fade on "was it
        // set this frame" would have held it on screen permanently for as long as you looked
        // at anything.
        const interactionPrompt = document.getElementById('screen-prompt');
        const PROMPT_HOLD_MS = 5000;
        let promptText = null, promptShownAt = 0;

        function setPrompt(text) {
            const clean = (text || '').replace(/^> ?/gm, '').trim();   // the "> " was HUD styling
            if (clean === promptText) return;

            promptShownAt = clean ? performance.now() : 0;
        }

        function updatePromptFade() {
            if (!interactionPrompt || !promptShownAt) return;
            if (performance.now() - promptShownAt > PROMPT_HOLD_MS) {

                promptShownAt = 0;          // faded; leave it until the wording changes
            }

        const keyStates = {};

        document.addEventListener('keydown', (e) => {
            keyStates[e.code] = true;

            // get into the world before it exists.
            if (isModelLoaded && !controls.isLocked && (e.code === 'KeyW' || e.code === 'KeyA' || e.code === 'KeyS' || e.code === 'KeyD' || e.code === 'ArrowUp' || e.code === 'ArrowDown' || e.code === 'ArrowLeft' || e.code === 'ArrowRight')) {
                controls.lock();
            }


        });
        document.addEventListener('keyup', (e) => { keyStates[e.code] = false; });

        instructions.addEventListener('click', () => {
            // Clicking early is the common case on a cold load — say so rather than
            // silently doing nothing, and don't lock the pointer over an empty scene.
            if (!isModelLoaded) {
                const el = document.getElementById('load-status');
                if (el) {
                    el.style.color = '#ffcc00';
                    setTimeout(() => { el.style.color = '#00ffff'; }, 400);
                }
                return;
            }
