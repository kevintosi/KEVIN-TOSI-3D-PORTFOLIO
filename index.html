<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Phones and tablets get the build made for them. This is deliberately the FIRST thing
         in the document: everything below it eventually pulls an 84MB model that a phone
         cannot hold, and the whole point is that the handoff happens before any of that
         starts. It is a static host, so there is no server to do this by user agent - it has
         to be the page's own first act.

         replace(), not assign(), so Back does not drop the visitor straight back here and
         bounce them again. ?desktop=1 opts out and is also what stops any loop: mobile.html
         carries no redirect of its own, so there is nothing to ping-pong with.

         The test matches the one the app itself uses, so the page you are handed and the
         controls you get can never disagree. -->
    <script>
        (function () {
            if (new URLSearchParams(location.search).has('desktop')) return;
            var ua = navigator.userAgent;
            var isMobile = /Android|iPhone|iPad|iPod|webOS|BlackBerry|IEMobile|Opera Mini/i.test(ua)
                        || ('ontouchstart' in window && window.innerWidth < 1024);
            if (isMobile) location.replace('mobile.html' + location.search);
        })();
    </script>

    <title>Kevin's Portfolio</title>
    <style>
        /* Two-finger sideways swipe on a trackpad is a history gesture in Chrome and Safari,
           and beta testers were triggering it while scrolling to navigate — one stray
           horizontal swipe and the browser leaves the page, which ends the session. This
           opts the document out of overscroll-driven navigation; the wheel handler below
           closes the rest of the gap. The back BUTTON still works — only the gesture is
           suppressed, which is the narrowest fix that solves it. */
        html {
            overscroll-behavior: none;
            overscroll-behavior-x: none;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            overscroll-behavior: none;
            overscroll-behavior-x: none;
            font-family: sans-serif;
            /* The WebGL canvas is drawn with alpha and a clear alpha of 0, so this is the
               backdrop behind the whole scene — not just the page margins. It also shows
               through the transparent hole a playing screen punches in the canvas, which
               is how the old red/teal gradient painted coloured bars across the theater.
               Flat black keeps that invisible even if a panel ever fails to cover its hole.

               Do NOT fix this by giving the renderer an opaque clear colour instead: the
               CSS3D iframes sit BEHIND the canvas (z-index 0 vs 1) and would be hidden.
               OLD: linear-gradient(to bottom, #ff4848 0%, #154c58 50%, #070e10 100%) */
            background: #000;
            height: 100vh;
        }

        canvas {
            display: block;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            font-weight: bold;
            pointer-events: none;
            z-index: 50;
            display: none;
            transition: opacity 0.3s ease;
        }

        #screen-prompt {
            position: absolute;
            top: 56px;
            left: 50%;
            transform: translateX(-50%);
            max-width: 80vw;
            text-align: center;
            white-space: pre-line;      /* the menu prompt is two lines */
            color: #ffffff;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
            font-weight: 600;
            font-size: 17px;
            letter-spacing: 2.5px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
            pointer-events: none;
            user-select: none;
            z-index: 210;
            opacity: 0;
            transition: opacity 0.55s ease-out;
        }

        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #0f0;
            background: rgba(0, 0, 0, 0.8);
            padding: 12px;
            font-family: monospace;
            pointer-events: none;
            user-select: none;
            border-radius: 5px;
            z-index: 200;
        }

        #instructions {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #000;
            color: white;
            text-align: center;
            z-index: 100;
        }

        .start-box {
            border: 2px solid white;
            padding: 30px;
            border-radius: 15px;
            background: rgba(0, 0, 0, 0.8);
            cursor: pointer;
        }

        /* Mobile touch controls */
        #mobile-controls {
            display: none;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 60;
            pointer-events: none;
        }
        #mobile-controls.active { display: block; }

        .mobile-btn {
            position: absolute;
            pointer-events: auto;
            background: rgba(255,255,255,0.12);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            color: rgba(255,255,255,0.6);
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
            transition: background 0.15s;
            z-index: 10;
        }
        .mobile-btn:active, .mobile-btn.pressed {
            background: rgba(255,255,255,0.35);
            border-color: rgba(255,255,255,0.6);
        }

        #mobile-fwd {
            width: 70px; height: 70px;
            bottom: 130px; left: 50px;
        }
        #mobile-back {
            width: 70px; height: 70px;
            bottom: 40px; left: 50px;
        }
        #mobile-left {
            width: 60px; height: 60px;
            bottom: 85px; left: 0px;
        }
        #mobile-right {
            width: 60px; height: 60px;
            bottom: 85px; left: 110px;
        }
        #mobile-jump {
            width: 75px; height: 75px;
            bottom: 85px; right: 20px;
            font-size: 16px; font-weight: bold;
            border-radius: 18px;
        }
        #mobile-interact {
            width: 60px; height: 60px;
            bottom: 85px; right: 110px;
            font-size: 14px; font-weight: bold;
            border-radius: 14px;
        }

        #mobile-look-zone {
            position: absolute;
            top: 0;
            right: 0;
            width: 55%;
            height: 100%;
            pointer-events: auto;
            touch-action: none;
            z-index: 1;
        }
        #mobile-look-indicator {
            position: absolute;
            width: 80px; height: 80px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 50%;

        #mobile-look-knob {

            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 50%;
            pointer-events: none;
            display: none;
        }
    </style>

    <div id="crosshair">+</div>

    <div id="mobile-controls">
        <div id="mobile-fwd" class="mobile-btn">▲</div>
        <div id="mobile-back" class="mobile-btn">▼</div>
        <div id="mobile-left" class="mobile-btn">◀</div>

    <!-- Standing hint, always on. The coordinate readout that used to live here was a
         development aid; nothing reads it any more. -->
    <div id="hud">PRESS ESC TO PAUSE</div>

    <!-- Interaction prompts. Centred at the top rather than tucked in the HUD corner, and
         faded out once read — see setPrompt(). Kept out of #hud deliberately: that box is
         the coordinate readout and is styled as a panel, which is not what a prompt wants. -->
    <div id="screen-prompt"></div>

    <div id="instructions">
        <canvas id="blob-bg" style="position:absolute;top:0;left:0;width:100%;height:100%;z-index:0;"></canvas>
        <!-- Dimmed until the world is ready. The welcome art has "CLICK HERE TO START"
             baked into it, so during the load it invites a click that is deliberately
             refused; fading the panel is what tells you it isn't live yet without
             touching the artwork. -->
        <div id="start-button" style="cursor:progress;perspective:800px;z-index:1;position:relative;
             opacity:0.5;transition:opacity 0.4s ease-out;">
            <img id="welcome-img" src="./ui/WELOME SCREEN.png" style="max-width:70vw;max-height:70vh;border-radius:15px;box-shadow:0 0 30px rgba(0,0,0,0.8);" alt="Welcome">
            <!-- The model is ~70MB, so on a cold load there is a long stretch where the
                 welcome screen is up and the world does not exist yet. Entering during it
                 used to put you in an empty scene with a film already playing. This line is
                 the only thing that says which of those two states you are in. -->
            <div id="load-status" style="margin-top:16px;text-align:center;font-family:monospace;
                 font-size:15px;letter-spacing:2px;color:#00ffff;text-shadow:0 0 8px rgba(0,255,255,0.5);">
                LOADING WORLD…
            </div>
            <div id="load-bar" style="margin:10px auto 0;width:min(70vw,420px);height:6px;
                 border-radius:3px;background:rgba(255,255,255,0.13);overflow:hidden;">
                <!-- Width is driven from the loader's progress events. The transition is
                     what keeps it from stepping in visible jumps between events. -->
                <div id="load-bar-fill" style="height:100%;width:0%;border-radius:3px;
                     background:#00ffff;box-shadow:0 0 10px rgba(0,255,255,0.75);
                     transition:width 0.25s ease-out;"></div>
            </div>
        </div>
    </div>
    <script>
        (function() {
            const img = document.getElementById('welcome-img');
            const instructionsEl = document.getElementById('instructions');
            // Skip all painting while the welcome overlay is hidden (in-game)
            const welcomeVisible = () => instructionsEl.style.display !== 'none';
            let deg = 0;
            let t = 0;
            function animate() {
                if (!welcomeVisible()) { requestAnimationFrame(animate); return; }
                t += 0.01;
                deg = (deg + 1) % 360;
                const rotY = Math.sin(t * 0.5) * 1;
                const rotX = Math.cos(t * 0.7) * 1;
                img.style.filter = 'hue-rotate(' + deg + 'deg)';
                img.style.transform = 'rotateY(' + rotY + 'deg) rotateX(' + rotX + 'deg)';
                requestAnimationFrame(animate);
            }
            animate();

            // Gradient blobs + noise background
            const canvas = document.getElementById('blob-bg');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const blobs = [
                { x: 0.3, y: 0.3, r: 0.5, hue: 0, speed: 0.3 },
                { x: 0.7, y: 0.6, r: 0.6, hue: 120, speed: 0.5 },
                { x: 0.5, y: 0.8, r: 0.45, hue: 240, speed: 0.4 },
                { x: 0.2, y: 0.7, r: 0.55, hue: 60, speed: 0.35 },
                { x: 0.8, y: 0.2, r: 0.5, hue: 300, speed: 0.45 },
            ];

            // Pre-generate static noise
            const noiseCanvas = document.createElement('canvas');
            noiseCanvas.width = canvas.width;
            noiseCanvas.height = canvas.height;
            const noiseCtx = noiseCanvas.getContext('2d');
            const noiseData = noiseCtx.createImageData(noiseCanvas.width, noiseCanvas.height);
            for (let i = 0; i < noiseData.data.length; i += 4) {
                const v = Math.random() * 255;
                noiseData.data[i] = v;
                noiseData.data[i+1] = v;
                noiseData.data[i+2] = v;
                noiseData.data[i+3] = 18;
            }
            noiseCtx.putImageData(noiseData, 0, 0);

            let blobTime = 0;
            function drawBlobs() {
                if (!welcomeVisible()) { requestAnimationFrame(drawBlobs); return; }
                blobTime += 0.02;
                ctx.fillStyle = '#070e10';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                blobs.forEach(b => {
                    const cx = (b.x + Math.sin(blobTime * b.speed) * 0.15) * canvas.width;
                    const cy = (b.y + Math.cos(blobTime * b.speed * 1.3) * 0.1) * canvas.height;
                    const radius = b.r * Math.min(canvas.width, canvas.height);
                    const hue = (b.hue + blobTime * 20) % 360;

                    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
                    grad.addColorStop(0, 'hsla(' + hue + ', 70%, 30%, 0.6)');
                    grad.addColorStop(0.5, 'hsla(' + hue + ', 60%, 20%, 0.3)');
                    grad.addColorStop(1, 'hsla(' + hue + ', 50%, 10%, 0)');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                });

                // Noise overlay
                ctx.drawImage(noiseCanvas, 0, 0);

                requestAnimationFrame(drawBlobs);
            }
            drawBlobs();

            window.addEventListener('resize', () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
            });
        })();
    </script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.164.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.164.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { Octree } from 'three/addons/math/Octree.js';
        import { Capsule } from 'three/addons/math/Capsule.js';
        import { CSS3DRenderer, CSS3DObject } from 'three/addons/renderers/CSS3DRenderer.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
        import { RGBShiftShader } from 'three/addons/shaders/RGBShiftShader.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // --- VIDEO LIBRARY ---
        // Metadata is fetched via the public oEmbed endpoints — no API keys needed.
        const VIMEO_VIDEO_IDS = [
            '1128975258', '1078393112', '857829118', '582261217', '579906331',
            '556944974', '526700417', '468200418', '417733245', '417730732',
            '404429083', '403800907', '403800607', '398152720', '383400117',
            '380320579', '356346926', '326184382', '308145046', '298124370',
            '233193409', '203225852', '199662655'
        ];
        // Shorts & cartoons only — this feeds the theater carousel. Commercial work belongs in
        // PROJECT_ROOMS instead. (The six MileagePlus spots — QUEST/EXPLORER — used to be
        // listed here and showed up in the theater alongside the films.)
        const YOUTUBE_VIDEO_IDS = ['rIpfYbs8Hr8', 'x2ol94_w8LE', 'YThPqz26C5o'];

        // Playback order, BY VIDEO ID.
        //
        // This used to be a list of titles matched with exact string equality against the
        // titles Vimeo/YouTube return from oEmbed at runtime. That is silently fragile: a
        // curly apostrophe (THE MERMAN’S CURSE), an added colon (HANES: CORONAVIRUS) or a
        // suffix (CLOWNS - SHOT ON THE SONY PMW-F3) makes the entry match nothing, and the
        // film drops to the end of the carousel with no warning. Six of the twenty-four
        // entries were failing that way.
        //
        // IDs never change, so ordering is stable no matter how you retitle a video. The
        // trailing comment on each line is for you — nothing matches on it. Anything not
        // listed here still appears, just after everything that is.
        const FILM_ORDER = [
            // Original running order, restored. Ordered by ID rather than title so that
            // renaming a film on Vimeo/YouTube can't quietly drop it to the end.
            '857829118',      // MIRROR
            '1128975258',     // PLEASE GOD JUST STOP
            '468200418',      // VOTE
            'x2ol94_w8LE',    // CLOWNS                                  [youtube]
            '1078393112',     // DAD'S DAY
            '203225852',      // JERRY THE TIME TRAVELING PERVERT
            '526700417',      // JESUS HAS RISEN
            '417730732',      // JESUS TAKE THE WHEEL
            'rIpfYbs8Hr8',    // PHRIEND                                 [youtube]
            '579906331',      // THE MERMAN'S CURSE
            '417733245',      // COME EAT MY BEANS
            '556944974',      // BROTHER
            '398152720',      // THE STAIRS
            '403800607',      // BUCKLEY JORDAN - BLOOD BOY
            '326184382',      // SIAMESE THREES
            'YThPqz26C5o',    // CRITTERS                                [youtube]
            '383400117',      // THE ADVENTURES OF FRUIT SALAD MAN AND TOWEL BOY
            '298124370',      // OK SHURE
            '233193409',      // POOPOODOH 2.0
            '403800907',      // HANES: CORONAVIRUS
            '582261217',      // LUVKDS
            '199662655',      // A LION STALKS ITS PREY
            '356346926',      // SLAPPYDOO
            '308145046',      // BUNJESUS

            // Not in the original 24 — they were fetched but never placed, so they sat at
            // the end. Kept there; move them up whenever you want them in the run.
            '404429083',      // SHLOME DINKUM - DEBT
            '380320579',      // RUNNING WITH REGIS
        ];

        // --- YouTube IFrame API loader ---
        let ytApiReady = false;
        window.onYouTubeIframeAPIReady = function () {
            ytApiReady = true;
        };
        const ytScript = document.createElement('script');
        ytScript.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(ytScript);

        // --- 1. CORE SETUP ---
        const scene = new THREE.Scene();
        const clock = new THREE.Clock();
        // near 0.05, not 0.005. A 0.005/1000 near-far ratio is 200,000:1, which leaves the
        // depth buffer almost no precision at normal viewing range — enough that a screen's
        // black border, sitting 2.5mm behind its face, could win the depth test and paint
        // over the hole-punch. That showed up as videos on one wall of each room going
        // black except for a sliver. The player capsule radius is 0.10, so the camera can
        // never get closer than that to geometry and 0.05 is safely inside it.
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.05, 1000);
        scene.add(camera);

        const cssRenderer = new CSS3DRenderer();
        cssRenderer.setSize(window.innerWidth, window.innerHeight);
        cssRenderer.domElement.style.position = 'absolute';
        cssRenderer.domElement.style.top = '0';
        cssRenderer.domElement.style.left = '0';
        cssRenderer.domElement.style.width = '100%';
        cssRenderer.domElement.style.height = '100%';
        cssRenderer.domElement.style.zIndex = '0';
        cssRenderer.domElement.style.pointerEvents = 'none';
        document.body.appendChild(cssRenderer.domElement);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.setClearColor(0x000000, 0);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFShadowMap;
        renderer.toneMapping = THREE.NoToneMapping;   // was ACESFilmicToneMapping
        renderer.toneMappingExposure = 1.0;           // was 1.5 (ignored while tone mapping is off)
        renderer.outputColorSpace = THREE.SRGBColorSpace;

        renderer.domElement.style.position = 'absolute';
        renderer.domElement.style.top = '0';
        renderer.domElement.style.left = '0';
        renderer.domElement.style.width = '100%';
        renderer.domElement.style.height = '100%';
        renderer.domElement.style.zIndex = '1';
        renderer.domElement.style.pointerEvents = 'auto';
        document.body.appendChild(renderer.domElement);

        // Post-Processing Setup for Chromatic Aberration
        const composer = new EffectComposer(renderer);

        const renderPass = new RenderPass(scene, camera);
        composer.addPass(renderPass);

        // --- CHROMATIC ABERRATION, WITH THE GALLERY PHOTOS EXEMPT ---
        // RGB shift is a full-screen effect, so it can't simply skip an object. Instead a
        // mask is rendered each frame — white where a gallery photo is actually visible,
        // black everywhere else — and the shader scales its shift to zero against it. The
        // mask comes from a real depth-tested render, so a photo behind a wall stays masked
        // out and the wall in front of it still gets the effect.
        //
        // Photos are identified by their texture: every gallery image exports as a .webp,
        // and nothing else in the model does. See buildGalleryCarousel() after the model loads.
        const PHOTO_LAYER = 5;

        // Half resolution — the mask only gates an effect, so it costs a quarter of the fill
        // and no visible precision. Depth is required or occlusion can't work.
        const maskTarget = new THREE.WebGLRenderTarget(1, 1, { depthBuffer: true });
        const maskBlack = new THREE.MeshBasicMaterial({ color: 0x000000 });
        const maskWhite = new THREE.MeshBasicMaterial({ color: 0xffffff });

        function renderPhotoMask() {
            const prevTarget = renderer.getRenderTarget();
            const prevAutoClear = renderer.autoClear;
            const prevMask = camera.layers.mask;

            renderer.setRenderTarget(maskTarget);
            renderer.autoClear = true;
            // 1. whole scene flat black — lays down correct depth
            scene.overrideMaterial = maskBlack;
            camera.layers.enableAll();
            camera.layers.disable(PHOTO_LAYER);
            renderer.clear(true, true, true);
            renderer.render(scene, camera);
            // 2. photos only, in white, on top of that depth
            scene.overrideMaterial = maskWhite;
            camera.layers.disableAll();
            camera.layers.enable(PHOTO_LAYER);
            renderer.autoClear = false;
            renderer.render(scene, camera);

            scene.overrideMaterial = null;
            camera.layers.mask = prevMask;
            renderer.autoClear = prevAutoClear;
            renderer.setRenderTarget(prevTarget);
        }

        // RGBShiftShader with a mask lookup added; everything else is the stock shader.
        const MaskedRGBShiftShader = {
            uniforms: {
                tDiffuse: { value: null },
                tMask:    { value: maskTarget.texture },
                amount:   { value: 0.0010 },
                angle:    { value: 0.0 },
            },
            vertexShader: /* glsl */`
                varying vec2 vUv;
                void main() {
                    vUv = uv;
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }`,
            fragmentShader: /* glsl */`
                uniform sampler2D tDiffuse;
                uniform sampler2D tMask;
                uniform float amount;
                uniform float angle;
                varying vec2 vUv;
                void main() {
                    // 1 on a gallery photo, 0 elsewhere. Sampled with the same uv, so it
                    // lines up with the frame being shifted.
                    float shielded = texture2D(tMask, vUv).r;
                    float amt = amount * (1.0 - shielded);
                    vec2 offset = amt * vec2(cos(angle), sin(angle));
                    vec4 cr = texture2D(tDiffuse, vUv + offset);
                    vec4 cga = texture2D(tDiffuse, vUv);
                    vec4 cb = texture2D(tDiffuse, vUv - offset);
                    gl_FragColor = vec4(cr.r, cga.g, cb.b, cga.a);
                }`,
        };

        const rgbShiftPass = new ShaderPass(MaskedRGBShiftShader);
        rgbShiftPass.uniforms['amount'].value = 0.000;
        composer.addPass(rgbShiftPass);

        maskTarget.setSize(Math.max(1, window.innerWidth >> 1),
                           Math.max(1, window.innerHeight >> 1));

        const outputPass = new OutputPass();
        composer.addPass(outputPass);

        // Load HDR Environment — skybox mesh so CSS3D can show through
        new RGBELoader().load('rocky_ridge_4k.hdr', function (texture) {
            texture.mapping = THREE.EquirectangularReflectionMapping;
            scene.environment = texture;

            const skyGeo = new THREE.SphereGeometry(500, 60, 40);
            skyboxMat = new THREE.MeshBasicMaterial({
                map: texture,
                side: THREE.BackSide,
                toneMapped: false
            });
            skyboxMat.userData.currentIntensity = 0.01;
            skyboxMat.color.setScalar(0.01);
            const skybox = new THREE.Mesh(skyGeo, skyboxMat);
            scene.add(skybox);
        });

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0);
        scene.add(ambientLight);

        const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
        hemiLight.position.set(0, 20, 0);
        scene.add(hemiLight);

        // WORLD CONFIG — the fill/key balance.
        //
        // `targetRoomLightIntensity` scales the ambient (x0.4) and hemisphere (x0.6) fill.
        // Both are non-directional: they add the same amount to a surface whatever way it
        // faces, so they are what flattens the shading. At 2 they were supplying ~48% of
        // the light on distant geometry and washing all the form out of it. 0.7 keeps
        // shadows from going pure black without doing the modelling for the sun.
        //
        // The light removed here goes into sunLight below instead, which does shape form —
        // measured on the test building that trade came out BRIGHTER on the lit face
        // (luminance 12.3 vs 9.4) while the unlit face went properly dark.
        let targetRoomLightIntensity = 0.7;      // was 2
        // Raised to compensate for the point lights moving to inverse-square falloff —
        // see POINT_LIGHT_DECAY. Same brightness up close, far less spill.
        let targetPointLightIntensity = 5;       // was 2
        let targetHdrIntensity = .01;
        const importedLights = [];

        // --- HOUSE LIGHTS ---
        // `dimMultiplier` scales every light in the scene (ambient, hemisphere, the point
        // lights, HDR/skybox and any lights imported from the .glb). It is now DERIVED once
        // per frame in the animation loop from whether anything is actually playing —
        // see filmIsPlaying(). It used to be assigned by hand in six places, which meant
        // each new screen type had to remember to set it, and stopping one screen while
        // another was still running would wrongly bring the lights back up.
        //
        // WORLD CONFIG — 0.5 is the "50% dim" while a film plays; 1.0 is house lights up.
        const DIM_WHEN_PLAYING = 0.5;
        // Dust particle opacity with the house lights up. It fades to 0 while a film plays.
        const DUST_OPACITY = 0.4;
        let dimMultiplier = 1.0;

        // The only light in the scene that shapes form — everything else is fill or is
        // local to the corridor. Raised as targetRoomLightIntensity came down, so the
        // total light is similar but far more of it is directional.
        const sunLight = new THREE.DirectionalLight(0xffffff, 2.5);   // was 1
        sunLight.position.set(10, 20, 10);
        sunLight.castShadow = false;
        sunLight.shadow.camera.left = -30;
        sunLight.shadow.camera.right = 30;
        sunLight.shadow.camera.top = 30;
        sunLight.shadow.camera.bottom = -30;
        sunLight.shadow.mapSize.width = 2048;
        sunLight.shadow.mapSize.height = 2048;
        sunLight.shadow.bias = -0.0001;
        scene.add(sunLight);

        // WORLD CONFIG — point lights, 8 of them.
        //
        // Order matters: the colour alternates by index (even = cool, odd = warm), so
        // keeping every left-hand light on an even index and every right-hand one on an
        // odd index is what preserves the blue-left / orange-right split. Add them in
        // pairs, left first.
        //
        // The first four flank the theater screen on the end wall and are unchanged. The
        // second four are two more stations further down, because every light used to sit
        // at z 1.00 and the corridor runs to z -10.2 — so the far half, which carries the
        // SEE'S / PROJECT FI / ORANGINA screens, was falling off into the dark. They sit at
        // mid-height (1.20) between the existing 0.50 and 2.00 tiers.
        // OLD: four at z 12.27, x -0.3 / 2.4, y -1 / 1.25.
        const pointLightsConfig = [
            { x: -0.95, y: 0.50, z:  1.00 },
            { x:  0.95, y: 0.50, z:  1.00 },
            { x: -0.95, y: 2.00, z:  1.00 },
            { x:  0.95, y: 2.00, z:  1.00 },
            { x: -0.95, y: 1.20, z: -3.50 },
            { x:  0.95, y: 1.20, z: -3.50 },
            { x: -0.95, y: 1.20, z: -7.50 },
            { x:  0.95, y: 1.20, z: -7.50 },
        ];
        const activePointLights = [];

        // The lights are invisible emitters — no bulb geometry. They used to carry a small
        // MeshBasicMaterial sphere each, which read as bare glowing orbs floating in mid-air
        // since there's no lamp or fixture modelled around them.
        //
        // Removing the spheres is purely cosmetic: a PointLight's illumination comes from
        // the light itself, not from any mesh parented to it, so the warm/cool wash and the
        // pools on the floor are untouched. To bring them back, parent a mesh to pLight:
        //   pLight.add(new THREE.Mesh(
        //       new THREE.SphereGeometry(0.03, 8, 8),
        //       new THREE.MeshBasicMaterial({ color })));
        // WORLD CONFIG — falloff for the corridor lights.
        //
        // These were decay 1 with infinite range, so brightness fell as 1/d instead of the
        // physical 1/d² and they never really stopped. Measured at the test building 21.6m
        // away they were still supplying 27% of its light — eight corridor lamps quietly
        // washing flat fill over the theater and the desert.
        //
        // At 21.6m: decay 1 gives 0.0926 per lamp, decay 2 gives 0.00429 — 22x less spill.
        // POINT_LIGHT_RANGE then cuts them off entirely; 10 comfortably covers the 1.3-wide
        // corridor and the 4m gaps between stations. targetPointLightIntensity was raised
        // to 5 to keep the corridor as bright as it was up close.
        const POINT_LIGHT_DECAY = 2;      // was 1
        const POINT_LIGHT_RANGE = 10;     // was 0 (infinite)

        // The lights are invisible emitters — no bulb geometry. They used to carry a small
        // MeshBasicMaterial sphere each, which read as bare glowing orbs floating in mid-air
        // since there's no lamp or fixture modelled around them.
        //
        // Removing the spheres is purely cosmetic: a PointLight's illumination comes from
        // the light itself, not from any mesh parented to it, so the warm/cool wash and the
        // pools on the floor are untouched. To bring them back, parent a mesh to pLight:
        //   pLight.add(new THREE.Mesh(
        //       new THREE.SphereGeometry(0.03, 8, 8),
        //       new THREE.MeshBasicMaterial({ color })));
        pointLightsConfig.forEach((cfg, i) => {
            const color = (i % 2 === 0) ? 0x98d9ff : 0xffaa00;
            const pLight = new THREE.PointLight(color, targetPointLightIntensity,
                                                POINT_LIGHT_RANGE, POINT_LIGHT_DECAY);
            pLight.position.set(cfg.x, cfg.y, cfg.z);

            scene.add(pLight);
            activePointLights.push(pLight);
        });

        // --- 3. PHYSICS ---
        // Tag a mesh NOCOLLIDE in Blender to keep it visible but give it no collision —
        // a floor you fall through, a prop you walk into. Case, spaces, underscores, hyphens
        // and Blender's .001 suffixes are all ignored, so NOCOLLIDE / no_collide /
        // "Floor NoCollide.002" are equivalent.
        // Matches nocollide / nocollision / nocollider so either spelling works.
        const isNoCollide = (name) => /nocolli/.test(String(name).toLowerCase().replace(/[^a-z]/g, ''));

        // A sliding door is any mesh named `door` followed by a NUMBER, with any run of
        // separators between: `door 1`, `door_2`, `Door.3`, `door10`. Requiring a digit is
        // what excludes `doorway` — after `door` it has a letter, so it never matches, and
        // it stays a static frame. GLTFLoader rewrites spaces and dots to underscores on
        // import, which `[^a-z0-9]*` covers either way.
        const isSlidingDoor = (name) => /^door[^a-z0-9]*\d/i.test(String(name));

        let isModelLoaded = false;
        const worldOctree = new Octree();

        // ====================================================================
        // WORLD CONFIG — everything below is tied to the specific .glb loaded.
        // Rebuild the world in Blender and these are the only numbers that
        // need re-deriving; every system above and below is world-agnostic.
        //
        // Workflow: walk to a spot, read the coordinates off the HUD (top-left),
        // paste them in here. Or load with ?debug=1 and use __world.tp(x, z).
        //
        // Values from the previous house/rooms world are kept in comments as
        // reference, marked OLD.
        // ====================================================================

        // How far the camera sits above the capsule's base — i.e. eye height. Total capsule
        // height is EYE_OFFSET + 2 * radius, so it can't grow without limit before you stop
        // fitting through openings.
        //
        // Eye height = EYE_OFFSET + PLAYER_RADIUS. Currently 0.40.
        // Total capsule height = EYE_OFFSET + 2*PLAYER_RADIUS = eye height + PLAYER_RADIUS.
        //
        // CAPSULE HEIGHT IS CONSTRAINED BY THE TIGHTEST SPACE IN THE MODEL.
        // `theater 1 tunnel` measures exactly 0.60 of interior clearance along its whole
        // run (floor top -0.05 -> -0.11, ceiling bottom 0.55 -> 0.49; it slopes gently).
        // At the previous 0.30 / 0.15 the capsule was 0.60 tall — a dead-exact fit. The
        // solver then had the capsule touching floor and ceiling on the same frame with no
        // way to satisfy both, and ejected it sideways back into the hallway.
        //
        // 0.30 / 0.10 gives a 0.50 capsule: 0.10 of clearance in that tunnel, and it still
        // clears the 0.42-wide doorways easily. The cost is 5cm of eye height, 0.45 -> 0.40.
        // Raise PLAYER_RADIUS again if you make the tunnel taller in Blender — but keep
        // (eye + radius) at least ~0.08 under the tunnel's clearance.
        //
        // A small radius is safe against tunnelling here: with substeps=5 at 60fps the
        // capsule advances ~0.017 per step at sprint speed, far under 0.10.
        // Previously 0.51/0.13 (eye 0.64), then 0.30/0.15 (eye 0.45).
        const EYE_OFFSET = 0.30;
        const PLAYER_RADIUS = 0.10;

        // Spawn point, given as the camera/eye position — this is what the HUD reports, so you
        // can stand where you want, read the HUD, and paste the numbers here. The capsule base
        // sits EYE_OFFSET below it, and y is a couple of cm high so the capsule starts clear of
        // the floor rather than inside it; gravity settles it on the first frame.
        //
        // Far end of the corridor, looking back up it toward the doors. The floor slab runs
        // z -10.39 .. 6.77, so this sits ~0.9m off the back edge.
        // The 0.11 is the capsule BASE: PLAYER_RADIUS plus a 1cm clearance so it starts just
        // above the floor rather than inside it. Gravity settles it on the first frame — which
        // is why this reads 0.41 while the HUD shows 0.40 once you're standing.
        //
        // On the approach walkway (Plane.003, x -0.35..0.35, z 7.33..24.49), facing back
        // toward the vault mouth so you walk the length of it on the way in.
        // OLD: (0, 0.16 + EYE_OFFSET, -9.5) far corridor end; (1.20, 0.21 + EYE_OFFSET, 6.04) house world.
        const SPAWN = new THREE.Vector3(0, 1 + EYE_OFFSET, 9);
        // Where the camera aims on entry. Level with the eye so you start looking straight
        // ahead rather than up or down.
        const SPAWN_LOOK = new THREE.Vector3(0, 0.45, 6.5);
        const playerCapsule = new Capsule(
            new THREE.Vector3(SPAWN.x, SPAWN.y - EYE_OFFSET, SPAWN.z),
            SPAWN.clone(),
            PLAYER_RADIUS
        );
        const playerVelocity = new THREE.Vector3();
        const playerDirection = new THREE.Vector3();
        let playerOnGround = false;
        let groundNormal = new THREE.Vector3(0, 1, 0);
        let headBobTime = 0;
        let cameraBobTime = 0;
        let lastSpaceTime = 0;
        let spaceHandled = false;
        // Anchored to SPAWN so standing still on the first frame doesn't teleport the player.
        const idlePos = new THREE.Vector3(SPAWN.x, SPAWN.y - EYE_OFFSET, SPAWN.z);

        // --- 4. THEATER SYSTEM ---
        const raycaster = new THREE.Raycaster();
        // Nothing is interactable past 4m, so don't pay to test geometry beyond it.
        // Raycasting still runs against the whole scene, which is what keeps walls
        // correctly occluding the screens behind them.
        // Must be >= the largest value in INTERACT_RANGE (defined further down), or that
        // entry silently can't reach — the theater screen wants 8.
        raycaster.far = 8;
        const centerPoint = new THREE.Vector2(0, 0);
        const textureLoader = new THREE.TextureLoader();

        let filmLibrary = [];

        let masterScreen;
        let cssObject, vimeoPlayer, youtubePlayer;
        let isVideoPaused = true;
        let currentFilmSource = 'vimeo';
        let screenMat;
        let backBtn, menuHitbox;
        let currentScreenWidth = 16;
        let currentScreenHeight = 9;
        let particleSystem;
        let skyboxMat = null;
        let menuGroup = new THREE.Group();
        let playbackGroup = new THREE.Group();

        let currentFilmIndex = 0;
        let menuThumbnails = [];
        let isHoveringMenu = false;
        let wheelCooldown = 0;


        // Applied on every YouTube player, on ready and again on play: full volume, and
        // captions off. cc_load_policy=0 in the embed URL asks for captions off, but YouTube
        // still turns them on when the viewer's account prefers them — unloading the captions
        // module is what actually keeps them off. Both module names are tried because the
        // player uses 'captions' or 'cc' depending on which variant it loaded.
        // `volumePercent` defaults to FULL, which is what the project-room screens want —
        // they're work you click on deliberately, and there's no distance ramp out there.
        // Only the main theater passes a value, because its level is driven by how close
        // you are (see currentTheaterVolume).
        //
        // This defaulted to the theater's proximity volume for a while, which silently
        // muted every work screen: outside the theater that value is 0.
        function applyPlayerPrefs(player, volumePercent = 100) {
            try { player.unMute(); player.setVolume(Math.round(volumePercent)); } catch (e) {}
            try { player.unloadModule('captions'); } catch (e) {}
            try { player.unloadModule('cc'); } catch (e) {}
        }

        // --- STANDALONE YOUTUBE SCREENS ---
        const ytScreens = [];

        // A screen that is playing has to be DRAWN BEFORE anything it needs to hide.
        //
        // The hole punch is `colorWrite = false`: it writes depth but no colour. Depth stops
        // whatever comes AFTER it, and does nothing about what came before — a colourless
        // pass cannot erase pixels already in the buffer. Every screen sat at renderOrder -1,
        // and within one renderOrder three.js sorts by shader program and material before
        // distance, so a screen two rooms away could paint first and then survive inside the
        // hole. That is what made the playing screen look see-through: the strip of pictures
        // in it was the CARS.COM row, 2.2m behind the wall.
        //
        // Dropping the playing one to -1000 puts it first in the opaque list unconditionally,
        // since renderOrder is compared before anything else.
        const SCREEN_ORDER = -1;
        const HOLE_PUNCH_ORDER = -1000;

        function setupYouTubeScreen(videoId, x, y, z, rotY = 0, width = 0.75, height = 0.42) {
            // Thick box — front face shows thumbnail, switches to hole-punch when playing
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 });
            const thumbUrl = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
            const thumbTex = textureLoader.load(thumbUrl);
            thumbTex.colorSpace = THREE.SRGBColorSpace;
            const frontMat = new THREE.MeshBasicMaterial({ map: thumbTex, toneMapped: false });
            const depth = 0.05;
            const screenGeo = new THREE.BoxGeometry(width, height, depth);
            // Box face order: +x, -x, +y, -y, +z (front), -z (back)
            const screenMesh = new THREE.Mesh(screenGeo, [blackMat, blackMat, blackMat, blackMat, frontMat, blackMat]);
            screenMesh.position.set(x, y, z);
            screenMesh.rotation.y = rotY;
            screenMesh.renderOrder = SCREEN_ORDER;
            screenMesh.userData = { type: 'yt_screen', videoId: videoId };
            screenMesh.layers.enable(1);
            screenMesh.layers.enable(2);
            scene.add(screenMesh);

            // Black border frame
            const borderPad = 0.03;
            const borderGeo = new THREE.BoxGeometry(width + borderPad * 2, height + borderPad * 2, depth + 0.005);
            const borderMat = new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.8 });
            const borderMesh = new THREE.Mesh(borderGeo, borderMat);
            borderMesh.position.copy(screenMesh.position);
            borderMesh.rotation.copy(screenMesh.rotation);
            // 0.02, not 0.005: at 2.5mm the border's front face sat inside the depth
            // buffer's error margin and could z-fight the screen it frames, painting
            // black over the hole-punch. This clears it by ~17mm, still invisible.
            borderMesh.translateZ(-0.02);
            scene.add(borderMesh);

            // CSS3D iframe. Height is derived from the screen's aspect rather than fixed at
            // 16:9 — an under-sized panel leaves part of the hole-punch transparent, which
            // shows the page's <body> gradient rather than black. These screens are all
            // built 16:9 today so it never bit, but it's the same defect that put coloured
            // bars across the theater screen.
            const CSS_W = 640;
            const CSS_H = Math.round(CSS_W * (height / width));
            const container = document.createElement('div');
            container.style.width = CSS_W + 'px';
            container.style.height = CSS_H + 'px';
            container.style.backgroundColor = '#000';
            container.style.pointerEvents = 'none';
            container.innerHTML = '';

            const cssObj = new CSS3DObject(container);
            cssObj.position.copy(screenMesh.position);
            cssObj.rotation.copy(screenMesh.rotation);
            const cssScale = width / CSS_W;
            cssObj.scale.set(cssScale, cssScale, cssScale);
            cssObj.translateZ(depth / 2 + 0.005);
            cssObj.visible = false;
            scene.add(cssObj);

            const screenData = { videoId, mesh: screenMesh, frontMat, thumbTex, cssObj, container, playing: false, paused: false, player: null };
            ytScreens.push(screenData);
            return screenData;
        }

        // The same hole-punch + CSS3D pairing as setupYouTubeScreen, but adopting a face
        // that already exists in the .glb instead of building a box for it. Used for the
        // classic laptop: the model has the screen, the bezel and the tilt already, and a
        // generated panel floated in front would fight all three.
        //
        // A YouTube film cannot be a VideoTexture the way the Slavic TV's local clip is —
        // it is a cross-origin iframe and its pixels are unreadable — so this has to punch
        // a hole rather than paint the mesh.
        //
        // Everything downstream (click to play, the prompt, one-embed-at-a-time, the
        // exclusivity rule) works off the ytScreens record, so it needs no special cases.
        // World-space centre of a mesh's geometry, which is not the same thing as its
        // origin once a model nests parts inside shared parents.
        const _bbc = new THREE.Vector3();
        function bbCentreWorld(mesh, out) {
            if (!mesh.geometry.boundingBox) mesh.geometry.computeBoundingBox();
            mesh.geometry.boundingBox.getCenter(_bbc);
            return out.copy(_bbc).applyMatrix4(mesh.matrixWorld);
        }

        function attachGlbYouTubeScreen(root, materialName, videoId) {
            let face = null;
            root.traverse((o) => {
                if (face || !o.isMesh || !o.material) return;
                const mats = Array.isArray(o.material) ? o.material : [o.material];
                if (mats.some(m => m && m.name === materialName)) face = o;
            });
            if (!face) {
                console.warn(`[glb-yt] no mesh using material "${materialName}" — ${videoId} not placed`);
                return null;
            }

            const thumbTex = textureLoader.load(`https://img.youtube.com/vi/${videoId}/mqdefault.jpg`);
            thumbTex.colorSpace = THREE.SRGBColorSpace;
            const frontMat = new THREE.MeshBasicMaterial({ map: thumbTex, toneMapped: false });
            if (Array.isArray(face.material)) {
                face.material = face.material.map(m => (m && m.name === materialName) ? frontMat : m);
            } else {
                face.material = frontMat;
            }

            face.userData = { type: 'yt_screen', videoId };
            face.layers.enable(1);
            face.layers.enable(2);
            face.renderOrder = SCREEN_ORDER;

            // World size and orientation come off the mesh, so moving or resizing the laptop
            // in Blender moves the iframe with it.
            if (!face.geometry.boundingBox) face.geometry.computeBoundingBox();
            const bb = face.geometry.boundingBox;
            const scale = face.getWorldScale(new THREE.Vector3());
            const worldW = (bb.max.x - bb.min.x) * scale.x;
            const worldH = (bb.max.y - bb.min.y) * scale.y;

            const CSS_W = 640;
            const container = document.createElement('div');
            container.style.width = CSS_W + 'px';
            container.style.height = Math.round(CSS_W * (worldH / worldW)) + 'px';
            container.style.backgroundColor = '#000';
            container.style.pointerEvents = 'none';

            const cssObj = new CSS3DObject(container);
            // The GEOMETRY's centre, not the object's origin. getWorldPosition returns the
            // origin, and in this model the laptop's screen quad shares an origin with the
            // lid it belongs to while its geometry sits offset from it — so aligning on the
            // origin dropped the iframe below the hole and left the top of the screen see
            // through. Everything else about the placement was already right.
            face.getWorldQuaternion(cssObj.quaternion);
            bbCentreWorld(face, cssObj.position);
            const cssScale = worldW / CSS_W;
            cssObj.scale.set(cssScale, cssScale, cssScale);
            cssObj.translateZ(0.002);      // just clear of the face, along its own normal
            cssObj.visible = false;
            scene.add(cssObj);

            const screenData = { videoId, mesh: face, frontMat, thumbTex, cssObj, container,
                                 playing: false, paused: false, player: null };
            ytScreens.push(screenData);
            console.info(`[glb-yt] "${materialName}" wired to ${videoId}`);
            return screenData;
        }

        // Tear an embed down and put the thumbnail back. Each live iframe is a full
        // YouTube player, so only one screen in the world may hold one at a time.
        function stopYtScreen(screenData) {
            if (!screenData.playing) return;
            if (screenData.player) {
                try { screenData.player.destroy(); } catch (e) {}
                screenData.player = null;
            }
            screenData.container.innerHTML = '';
            screenData.cssObj.visible = false;
            screenData.frontMat.map = screenData.thumbTex;
            screenData.frontMat.color.set(0xffffff);
            screenData.frontMat.colorWrite = true;
            screenData.mesh.renderOrder = SCREEN_ORDER;
            screenData.frontMat.needsUpdate = true;
            screenData.playing = false;
            screenData.paused = false;
        }

        function toggleYtScreen(screenData) {
            if (screenData.playing && !screenData.paused) {
                // Pause
                if (screenData.player) {
                    try { screenData.player.pauseVideo(); } catch(e) {}
                }
                screenData.paused = true;
            } else if (screenData.playing && screenData.paused) {
                // Resume
                if (screenData.player) {
                    try { screenData.player.playVideo(); } catch(e) {}
                }
                screenData.paused = false;
            } else {
                // First play — retire whatever else is running, then hole-punch and load
                ytScreens.forEach(s => { if (s !== screenData) stopYtScreen(s); });
                localScreens.forEach(s => { if (s.playing) toggleLocalScreen(s); });
                screenData.frontMat.map = null;
                screenData.frontMat.color = new THREE.Color(0x000000);
                screenData.frontMat.colorWrite = false;
                screenData.mesh.renderOrder = HOLE_PUNCH_ORDER;
                screenData.frontMat.needsUpdate = true;

                const origin = encodeURIComponent(window.location.origin);
                const embedSrc = `https://www.youtube.com/embed/${screenData.videoId}?enablejsapi=1&origin=${origin}&autoplay=1&rel=0&playsinline=1&cc_load_policy=0`;
                screenData.container.innerHTML = `
                    <div style="width:100%;height:100%;position:relative;">
                        <iframe src="${embedSrc}" frameborder="0"
                                allow="autoplay; fullscreen; encrypted-media"
                                allowfullscreen playsinline
                                style="position:absolute;top:0;left:0;width:100%;height:100%;"
                                title="YouTube"></iframe>
                    </div>
                `;
                screenData.cssObj.visible = true;
                screenData.playing = true;
                screenData.paused = false;

                // Init YT player API for unmute
                if (ytApiReady && window.YT) {
                    const iframe = screenData.container.querySelector('iframe');
                    if (iframe) {
                        screenData.player = new window.YT.Player(iframe, {
                            events: {
                                'onReady': (e) => { applyPlayerPrefs(e.target); e.target.playVideo(); },
                                'onStateChange': (e) => {
                                    if (e.data === window.YT.PlayerState.PLAYING) {
                                        applyPlayerPrefs(e.target);
                                    }
                                }
                            }
                        });
                    }
                }
            }
        }

        // One-off YouTube screens placed by hand — add a line here to hang a new one.
        // Optional per-screen overrides: width (default 0.75), height (default 0.42)
        // Everything project-related now lives in PROJECT_ROOMS below instead.
        const YT_WALL_SCREENS = [];
        YT_WALL_SCREENS.forEach(s => setupYouTubeScreen(s.videoId, s.x, s.y, s.z, s.rotY, s.width, s.height));

        // --- STANDALONE VIMEO SCREENS ---
        // Same hole-punch trick as the YouTube screens: a box whose front face shows the
        // poster frame, swapped for a transparent hole (colorWrite false) with a CSS3D
        // <iframe> sitting behind the canvas, which then shows through.
        //
        // Vimeo needs an oEmbed round-trip that YouTube doesn't. The poster URL can't be
        // derived from the ID, and unlisted videos carry a privacy hash in their real
        // player src that only oEmbed returns — so the mesh is created immediately (so it
        // is clickable straight away) and the poster is filled in when the fetch lands.
        const vimeoScreens = [];

        function setupVimeoScreen(videoId, x, y, z, rotY = 0, width = 1.6, height = 0.9, title = '') {
            const blackMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 1 });
            const frontMat = new THREE.MeshBasicMaterial({ color: 0x111111, toneMapped: false });
            const depth = 0.05;
            const screenGeo = new THREE.BoxGeometry(width, height, depth);
            // Box face order: +x, -x, +y, -y, +z (front), -z (back)
            const screenMesh = new THREE.Mesh(screenGeo, [blackMat, blackMat, blackMat, blackMat, frontMat, blackMat]);
            screenMesh.position.set(x, y, z);
            screenMesh.rotation.y = rotY;
            screenMesh.renderOrder = SCREEN_ORDER;
            screenMesh.userData = { type: 'vimeo_screen', videoId };
            screenMesh.layers.enable(1);
            screenMesh.layers.enable(2);
            scene.add(screenMesh);

            // Black surround, sized to the modelled slab so it reads as the same fixture.
            const borderPad = 0.035;
            const borderMesh = new THREE.Mesh(
                new THREE.BoxGeometry(width + borderPad * 2, height + borderPad * 2, depth + 0.005),
                new THREE.MeshStandardMaterial({ color: 0x000000, roughness: 0.8 })
            );
            borderMesh.position.copy(screenMesh.position);
            borderMesh.rotation.copy(screenMesh.rotation);
            // 0.02, not 0.005: at 2.5mm the border's front face sat inside the depth
            // buffer's error margin and could z-fight the screen it frames, painting
            // black over the hole-punch. This clears it by ~17mm, still invisible.
            borderMesh.translateZ(-0.02);
            scene.add(borderMesh);

            // The CSS3D panel must match the screen's aspect EXACTLY, not the video's.
            //
            // A playing screen punches a transparent hole in the canvas and this iframe
            // shows through from behind. Any part of the hole the panel doesn't cover isn't
            // black — it's see-through, revealing the page's <body> gradient (#ff4848 red at
            // the top, #154c58 teal at the middle). A fixed 1280x720 panel on a screen that
            // isn't exactly 16:9 left ~0.036 uncovered top and bottom and painted two
            // coloured bars across the screen.
            //
            // Deriving the height from the screen's own proportions makes the panel fill the
            // hole whatever shape the screen is modelled. A non-16:9 screen then letterboxes
            // the video inside the player, against the container's own black.
            const CSS_W = 1280;
            const CSS_H = Math.round(CSS_W * (height / width));
            const container = document.createElement('div');
            container.style.width = CSS_W + 'px';
            container.style.height = CSS_H + 'px';
            container.style.backgroundColor = '#000';
            container.style.pointerEvents = 'none';

            const cssObj = new CSS3DObject(container);
            cssObj.position.copy(screenMesh.position);
            cssObj.rotation.copy(screenMesh.rotation);
            const cssScale = width / CSS_W;
            cssObj.scale.set(cssScale, cssScale, cssScale);
            cssObj.translateZ(depth / 2 + 0.005);
            cssObj.visible = false;
            scene.add(cssObj);

            const screenData = {
                videoId, title, mesh: screenMesh, frontMat, thumbTex: null, cssObj, container,
                embedUrl: `https://player.vimeo.com/video/${videoId}`,
                playing: false, paused: false, player: null,
            };
            vimeoScreens.push(screenData);

            fetch('https://vimeo.com/api/oembed.json?url=' +
                  encodeURIComponent('https://vimeo.com/' + videoId) + '&width=1280')
                .then(r => r.json())
                .then(v => {
                    const srcMatch = (v.html || '').match(/src="([^"]+)"/);
                    if (srcMatch) screenData.embedUrl = srcMatch[1];
                    if (!screenData.title) screenData.title = (v.title || '').toUpperCase();
                    if (!v.thumbnail_url) return;
                    const tex = textureLoader.load(v.thumbnail_url, () => {
                        // Don't stomp the hole-punch if the viewer already hit play.
                        if (screenData.playing) return;
                        screenData.frontMat.map = tex;
                        screenData.frontMat.color.set(0xffffff);
                        screenData.frontMat.needsUpdate = true;
                    });
                    tex.colorSpace = THREE.SRGBColorSpace;
                    screenData.thumbTex = tex;
                })
                .catch(err => console.warn('[vimeo] oEmbed failed for', videoId, err));

            return screenData;
        }

        // Tear the embed down and put the poster back.
        function stopVimeoScreen(screenData) {
            if (!screenData.playing) return;
            if (screenData.player) {
                try { screenData.player.destroy(); } catch (e) {}
                screenData.player = null;
            }
            screenData.container.innerHTML = '';
            screenData.cssObj.visible = false;
            screenData.frontMat.map = screenData.thumbTex || null;
            screenData.frontMat.color.set(screenData.thumbTex ? 0xffffff : 0x111111);
            screenData.frontMat.colorWrite = true;
            screenData.mesh.renderOrder = SCREEN_ORDER;
            screenData.frontMat.needsUpdate = true;
            screenData.playing = false;
            screenData.paused = false;
        }

        function toggleVimeoScreen(screenData) {
            if (screenData.playing && !screenData.paused) {
                if (screenData.player) { try { screenData.player.pause(); } catch (e) {} }
                screenData.paused = true;
            } else if (screenData.playing && screenData.paused) {
                if (screenData.player) { try { screenData.player.play(); } catch (e) {} }
                screenData.paused = false;
            } else {
                // Only one embed anywhere in the world at a time — each is a full player.
                ytScreens.forEach(s => stopYtScreen(s));
                localScreens.forEach(s => { if (s.playing) toggleLocalScreen(s); });
                vimeoScreens.forEach(s => { if (s !== screenData) stopVimeoScreen(s); });

                screenData.frontMat.map = null;
                screenData.frontMat.color = new THREE.Color(0x000000);
                screenData.frontMat.colorWrite = false;
                screenData.mesh.renderOrder = HOLE_PUNCH_ORDER;
                screenData.frontMat.needsUpdate = true;

                const sep = screenData.embedUrl.includes('?') ? '&' : '?';
                const embedSrc = screenData.embedUrl + sep +
                    'autoplay=1&autopause=0&badge=0&player_id=0&playsinline=1&title=0&byline=0&portrait=0';
                screenData.container.innerHTML = `
                    <div style="width:100%;height:100%;position:relative;">
                        <iframe src="${embedSrc}" frameborder="0"
                                allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media"
                                referrerpolicy="strict-origin-when-cross-origin"
                                allowfullscreen playsinline
                                style="position:absolute;top:0;left:0;width:100%;height:100%;"
                                title="${screenData.title || 'Vimeo'}"></iframe>
                    </div>
                `;
                screenData.cssObj.visible = true;
                screenData.playing = true;
                screenData.paused = false;

                const iframe = screenData.container.querySelector('iframe');
                if (window.Vimeo && window.Vimeo.Player && iframe) {
                    screenData.player = new Vimeo.Player(iframe);
                    screenData.player.setVolume(1).catch(() => {});
                    screenData.player.on('ended', () => stopVimeoScreen(screenData));
                }
            }
        }

        // WORLD CONFIG — films shown on a screen modelled in the .glb.
        //
        // `marker` is the name of the object in the GLB that stands in for the screen. It
        // gets hidden and this code builds a real screen at its exact position, size and
        // facing — so you place and resize the screen in Blender, not here.
        //
        // The marker has to be hidden rather than just covered: a playing screen punches a
        // transparent hole in the canvas so the iframe behind it shows through, and any
        // geometry still drawing in that hole would block the video.
        // Empty: `theater_1_screen` now carries the MAIN theater (the full carousel with
        // every short), not a single pinned film — see MAIN_THEATER_MARKER below. Add an
        // entry here only for a screen that should play one fixed video with no UI.
        // Was: { marker: 'theater_1_screen', videoId: '1128975258', title: 'PLEASE GOD JUST STOP' }
        const THEATER_SCREENS = [];

        // --- LOCAL VIDEO SCREENS ---
        const localScreens = [];

        function setupLocalVideoScreen(videoSrc, x, y, z, rotY = 0, width = 0.28, height = 0.21) {
            const frontMat = new THREE.MeshBasicMaterial({ color: 0x111111, toneMapped: false });
            const screenGeo = new THREE.PlaneGeometry(width, height, 20, 1);
            // Bow outward on +z — a convex curve, like the face of an old CRT
            const posAttr = screenGeo.attributes.position;
            const halfW = width / 2;
            for (let i = 0; i < posAttr.count; i++) {
                const lx = posAttr.getX(i);
                const curve = 0.02 * (1 - Math.pow(lx / halfW, 2));
                posAttr.setZ(i, curve);
            }
            posAttr.needsUpdate = true;
            screenGeo.computeVertexNormals();
            // Crop UVs to 4:3 center of 16:9 source (trim 12.5% from each side)
            const uvAttr = screenGeo.attributes.uv;
            for (let i = 0; i < uvAttr.count; i++) {
                const u = uvAttr.getX(i);
                uvAttr.setX(i, 0.125 + u * 0.75);
            }
            uvAttr.needsUpdate = true;
            const screenMesh = new THREE.Mesh(screenGeo, frontMat);
            screenMesh.position.set(x, y, z);
            screenMesh.rotation.y = rotY;
            screenMesh.userData = { type: 'local_screen', videoSrc: videoSrc };
            screenMesh.layers.enable(1);
            screenMesh.layers.enable(2);
            scene.add(screenMesh);

            const screenData = { videoSrc, mesh: screenMesh, frontMat, video: null, texture: null, playing: false };
            localScreens.push(screenData);
            return screenData;
        }

        // Put a local video onto a screen that already exists in the .glb, rather than
        // floating a plane in front of it. The model carries a `Slavic_Tv` whose face is a
        // mesh using the material named `tv_screen` — matching on the MATERIAL name, not the
        // mesh name, because the exporter splits the set into `tv` / `tv_1` by material and
        // those names carry no meaning on their own.
        //
        // Texturing the modelled face means the UVs, the curve of the glass and the fit
        // inside the casing are whatever you built in Blender. Nothing here needs to know
        // the TV's size, position or facing — move it in the model and this follows.
        //
        // It joins localScreens, so it inherits click-to-play, the interaction prompt, the
        // house-lights dim and pause-on-escape without any of that being special-cased.
        // uv — how the video texture has to be turned to match the model's own UVs.
        //   { flipY }    false flips vertically. glTF authors UVs with a top-left origin,
        //                which is the opposite of a video texture's default, so a screen
        //                taken from the model usually wants this.
        //   { rotation } radians about the middle of the texture, for UVs that are turned
        //                rather than mirrored.
        //
        // The Slavic TV needs flipY false and nothing else. Worth recording how that was
        // established, because guessing it from a photographic frame does not work: a
        // rotation and a reflection both leave a person the right way up, and telling them
        // apart by eye means picking out which side a shirt is lit from. Park the clip on
        // its title card and read the words instead — mirrored text is unmistakable.
        function attachGlbScreenVideo(root, materialName, videoSrc, uv = {}, loop = true) {
            let face = null;
            root.traverse((o) => {
                if (face || !o.isMesh || !o.material) return;
                const mats = Array.isArray(o.material) ? o.material : [o.material];
                if (mats.some(m => m && m.name === materialName)) face = o;
            });
            if (!face) {
                console.warn(`[glb-screen] no mesh using material "${materialName}" — video not placed`);
                return null;
            }

            // Its own material instance: the .glb may share `tv_screen` with something else,
            // and a shared one would put the video on both.
            const frontMat = new THREE.MeshBasicMaterial({ color: 0x111111, toneMapped: false });
            if (Array.isArray(face.material)) {
                face.material = face.material.map(m => (m && m.name === materialName) ? frontMat : m);
            } else {
                face.material = frontMat;
            }

            face.userData = { type: 'local_screen', videoSrc };
            face.layers.enable(1);   // raycast/interaction layers, same as the built screens
            face.layers.enable(2);

            // The model's screen is whatever shape it is — the Slavic TV's face is 1.22:1
            // against a 16:9 source — and a video texture stretched across it comes out
            // squashed. Measure the face here and let toggleLocalScreen crop the source to
            // match, so nothing has to be hardcoded per screen.
            if (!face.geometry.boundingBox) face.geometry.computeBoundingBox();
            const fb = face.geometry.boundingBox;
            const faceAspect = (fb.max.x - fb.min.x) / (fb.max.y - fb.min.y);

            const screenData = { videoSrc, mesh: face, frontMat, video: null, texture: null,
                                 playing: false, uv, loop,
                                 fitAspect: uv.fit !== undefined ? uv.fit : faceAspect };
            localScreens.push(screenData);
            console.info(`[glb-screen] "${materialName}" wired to ${videoSrc.split('/').pop()}`);
            return screenData;
        }

        function toggleLocalScreen(screenData) {
            if (screenData.playing) {
                if (screenData.video) screenData.video.pause();
                screenData.playing = false;
            } else {
                const isFirstPlay = !screenData.video;
                if (isFirstPlay) {
                    screenData.video = document.createElement('video');
                    screenData.video.src = screenData.videoSrc;
                    screenData.video.crossOrigin = 'anonymous';
                    // loop defaults on, but a screen can opt out — the Slavic TV plays its
                    // clip through once and then waits to be clicked again.
                    screenData.video.loop = screenData.loop !== false;
                    if (screenData.loop === false) {
                        // Without this `playing` stays true at the end, so the next click
                        // reads as PAUSE and it takes two to start it over.
                        screenData.video.addEventListener('ended', () => { screenData.playing = false; });
                    }
                    screenData.video.playsInline = true;
                    screenData.texture = new THREE.VideoTexture(screenData.video);
                    screenData.texture.colorSpace = THREE.SRGBColorSpace;
                    // Screens taken from the .glb carry the model's own UVs, which need not
                    // agree with a video texture's default orientation. See attachGlbScreenVideo.
                    const uv = screenData.uv;
                    if (uv) {
                        if (uv.flipY !== undefined) screenData.texture.flipY = uv.flipY;
                        if (uv.rotation) {
                            screenData.texture.center.set(0.5, 0.5);
                            screenData.texture.rotation = uv.rotation;
                        }
                    }

                    // Crop the source to the screen's shape instead of stretching it to fit,
                    // the same choice the code-built CRT panels make. Waits for metadata
                    // because videoWidth/videoHeight are 0 until then, which would otherwise
                    // compute a crop of NaN and blank the screen.
                    if (screenData.fitAspect) {
                        const tex = screenData.texture, v = screenData.video;
                        const fit = () => {
                            if (!v.videoWidth || !v.videoHeight) return;
                            const srcAspect = v.videoWidth / v.videoHeight;
                            const target = screenData.fitAspect;
                            if (srcAspect > target) {          // source too wide: trim the sides
                                const k = target / srcAspect;
                                tex.repeat.x = k; tex.offset.x = (1 - k) / 2;
                            } else if (srcAspect < target) {   // too tall: trim top and bottom
                                const k = srcAspect / target;
                                tex.repeat.y = k; tex.offset.y = (1 - k) / 2;
                            }
                            tex.needsUpdate = true;
                        };
                        if (v.readyState >= 1) fit();
                        else v.addEventListener('loadedmetadata', fit, { once: true });
                    }
                }
                screenData.frontMat.map = screenData.texture;
                screenData.frontMat.color.set(0xffffff);
                screenData.frontMat.needsUpdate = true;
                // Parked on its last frame after a non-looping run; play() from there would
                // end instantly, so rewind first.
                if (screenData.video.ended) screenData.video.currentTime = 0;
                screenData.video.play().catch(e => console.warn('Local video play error:', e));
                screenData.playing = true;
            }
        }

        // Local video screens — add a line here to place a new screen.
        // Optional per-screen overrides: rotY (default 0), width (default 0.28), height (default 0.21)
        // WORLD CONFIG — on the left wall, past the end of the PROJECT FI ribbon (z -13.80).
        // OLD: { x: -1.32, y: 0.4, z: 2 } in the house world.
        // Empty: how-to-make-content.mp4 now plays on the Slavic TV in the model instead of
        // on a plane here. Add a line back to hang a local clip on a code-built panel.
        const LOCAL_VIDEO_SCREENS = [];
        LOCAL_VIDEO_SCREENS.forEach(s => setupLocalVideoScreen(s.src, s.x, s.y, s.z, s.rotY, s.width, s.height));

        // --- BILLBOARD VIDEO ---
        // A video plane that re-orients to face the camera every frame, so it never goes
        // edge-on. Used down the fall shaft, where the player is dropping past it. Plays only
        // while the camera is within `playWithin` so it isn't decoding all session.
        const billboards = [];

        // playWithin  — starts/stops playback, and the distance at which volume reaches zero.
        // fullVolumeAt — inside this radius the clip is at full volume; between the two the
        //               volume ramps, so it fades up as you fall toward it.
        // startWithin — the distance that STARTS playback, kept separate from playWithin so a
        // clip can begin early without stretching its volume ramp over the same range. Down
        // the fall shaft those want to be very different numbers: you want the clip already
        // running long before you are close enough to hear it. Defaults to playWithin, so
        // every existing call behaves exactly as it did.
        //
        // playOnce — runs to the end once and then never again this session, the same latch
        // the wall videos use. Walking away and coming back does not restart it.
        // startBox — an alternative to startWithin's radius: play only while EVERY axis is
        // within this many units of the panel, so it's a cube around it rather than a
        // sphere. Down the shaft that's the difference between "somewhere within 5 metres"
        // and "no further than 5 in x, 5 in y and 5 in z", which is the stricter of the two
        // and is what reads naturally off the coordinate HUD. Overrides startWithin when set.
        function setupBillboardVideo(src, x, y, z, size = 2.5, playWithin = 10, fullVolumeAt = 2.5,
                                     loop = true, playOnce = false, startWithin = null,
                                     startBox = null) {
            const video = document.createElement('video');
            video.src = src;
            video.loop = loop;
            video.playsInline = true;
            video.preload = 'auto';
            video.muted = false;
            video.volume = 0;          // ramped by distance in the animation loop

            const tex = new THREE.VideoTexture(video);
            tex.colorSpace = THREE.SRGBColorSpace;
            const mesh = new THREE.Mesh(
                // scene1.webm is square (2000x2000), so the plane is 1:1 — not 16:9.
                new THREE.PlaneGeometry(size, size),
                new THREE.MeshBasicMaterial({
                    map: tex,
                    toneMapped: false,
                    side: THREE.DoubleSide,
                    // The webm is VP9 with an alpha layer (~76% of the frame is fully
                    // transparent). Without transparent:true three.js ignores that channel
                    // and the clip renders as an opaque square.
                    transparent: true,
                    // ...and without this the quad still writes depth across its transparent
                    // region, so the cut-out area would occlude whatever is behind it.
                    depthWrite: false
                })
            );
            mesh.position.set(x, y, z);
            scene.add(mesh);

            const bb = { mesh, video, playWithin, fullVolumeAt, playing: false,
                         startWithin: startWithin == null ? playWithin : startWithin,
                         startBox, playOnce, done: false };
            if (playOnce) {
                video.addEventListener('ended', () => {
                    bb.done = true; bb.playing = false; video.volume = 0;
                });
            }
            billboards.push(bb);
            return bb;
        }

        // A video fixed flat to a wall. Same proximity play + distance volume as the
        // billboards above, but it keeps the rotation you give it instead of turning to
        // follow the camera (`fixed: true`), and it renders opaque — these are solid clips
        // on a wall, not alpha cut-outs, so writing depth normally is correct here.
        // A white rounded rectangle on black, used as an alphaMap to round off a panel's
        // corners. Drawn at the panel's own aspect ratio so the corners stay circular rather
        // than stretching into ellipses, and with arcs rather than ctx.roundRect for older
        // Safari. radius is in world units, same as width/height.
        function roundedAlphaMask(width, height, radius, longSidePx = 1024) {
            const aspect = width / height;
            const h = Math.round(aspect >= 1 ? longSidePx / aspect : longSidePx);
            const w = Math.round(h * aspect);
            const c = document.createElement('canvas');
            c.width = w; c.height = h;
            const g = c.getContext('2d');
            g.fillStyle = '#000';
            g.fillRect(0, 0, w, h);
            const r = Math.max(0, Math.min(radius / height * h, Math.min(w, h) / 2));
            g.fillStyle = '#fff';
            g.beginPath();
            g.moveTo(r, 0);
            g.arcTo(w, 0, w, h, r);
            g.arcTo(w, h, 0, h, r);
            g.arcTo(0, h, 0, 0, r);
